<head>
<meta charset="utf-8">

<title>Upper North Shop Performance</title>

<style>
:root{
  --bg:#f5f6f8; --card:#fff; --ink:#1b1f24; --muted:#6b7280; --line:#e5e7eb;
  --cur:#e4002b; --prev:#94a3b8; --target:#1b1f24;
  --good:#16a34a; --goodbg:#dcfce7; --warn:#d97706; --warnbg:#fef3c7; --bad:#dc2626; --badbg:#fee2e2;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;font-family:"IBM Plex Sans Thai",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.hwrap{max-width:1500px;margin:0 auto;padding:12px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.brand{font-weight:700;font-size:18px}
.brand small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.spacer{flex:1}
select{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
nav{max-width:1500px;margin:0 auto;padding:0 20px;display:flex;gap:4px;overflow-x:auto}
nav a{padding:10px 14px;text-decoration:none;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;font-weight:500}
nav a.on{color:var(--ink);border-color:var(--cur)}
main{max-width:1500px;margin:0 auto;padding:20px}
.banner{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;padding:8px 12px;border-radius:8px;margin-bottom:16px;font-size:13px}
.grid{display:grid;gap:16px}
.g5{grid-template-columns:repeat(4,minmax(0,1fr))}
.radars .card{padding:12px}
.g2{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1200px){.g5{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:1000px){.g5{grid-template-columns:repeat(2,minmax(0,1fr))}.g2,.g4{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){.g5{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.card h3{margin:0 0 4px;font-size:15px}
.card .sub{color:var(--muted);font-size:12px;margin-bottom:8px}
.tile{cursor:pointer;transition:box-shadow .15s}
.tile:hover{box-shadow:0 4px 14px rgba(0,0,0,.08)}
.tile .lbl{color:var(--muted);font-size:12.5px}
.tile .val{font-size:28px;font-weight:700;margin:2px 0}
.tile .d{font-size:12.5px}
.up{color:var(--good)} .down{color:var(--bad)}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600}
.p-good{background:var(--goodbg);color:var(--good)}.p-warn{background:var(--warnbg);color:var(--warn)}.p-bad{background:var(--badbg);color:var(--bad)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:5px;border-radius:2px}
.radar text{font-family:inherit}
.mini{cursor:pointer}
.mini:hover{box-shadow:0 4px 14px rgba(0,0,0,.08)}
.mini .go{font-size:12px;color:var(--cur);font-weight:600}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:500;font-size:12px;background:#fafafa;position:sticky;top:0}
.hm td.c{text-align:center;font-weight:600;font-size:12px}
.hm tr:hover td{outline:0;background-image:linear-gradient(rgba(0,0,0,.03),rgba(0,0,0,.03))}
.hm td:first-child{cursor:pointer}
.grid>*{min-width:0}
.card{max-width:100%;min-width:0}
.sub,.note,h2,h3,.hint li,.legend{overflow-wrap:anywhere}
main{overflow-x:clip}
.row>*{min-width:0}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
.scroll{-webkit-overflow-scrolling:touch}
.scroll td:first-child,.scroll th:first-child{position:sticky;left:0;background:#fff;z-index:1}
.scroll th:first-child{z-index:2;background:#fafafa}
.ns-tiles{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:8px 0 12px}
.ns-tiles>div{background:#f9fafb;border-radius:10px;padding:10px 12px}
@media(hover:none){.mini:hover,.tile:hover{box-shadow:none}}
/* tablet */
@media(max-width:1000px){.ns-tiles{grid-template-columns:repeat(3,1fr)} .scroll{max-height:70vh}}
/* phone (iOS / Android) */
@media(max-width:700px){
  body{font-size:13px}
  .hwrap{padding:8px max(12px,env(safe-area-inset-right)) 8px max(12px,env(safe-area-inset-left));gap:6px}
  .brand{font-size:15px;width:100%}
  .hwrap label{width:100%;display:flex;align-items:center;gap:6px}
  .hwrap select{flex:1;min-width:0;width:100%;font-size:16px}
  nav{padding:0 6px;scrollbar-width:none} nav::-webkit-scrollbar{display:none}
  nav a{padding:8px 10px;font-size:13px}
  main{padding:10px max(10px,env(safe-area-inset-right)) 24px max(10px,env(safe-area-inset-left))}
  .grid{gap:10px}
  .card{padding:12px;border-radius:10px}
  .row{gap:8px}
  .row h2{font-size:18px}
  .row .spacer{display:none}
  table{font-size:12px} th,td{padding:6px 6px}
  .ns-tiles{grid-template-columns:repeat(2,1fr)}
  body .hint-bg{padding:0;align-items:stretch}
  body .hint{border-radius:0;min-height:100%;max-width:none;padding:14px 12px calc(14px + env(safe-area-inset-bottom))}
  body .hint .x{font-size:28px;padding:0 4px;position:sticky;top:0}
  .seg button{padding:6px 10px}
}
.scroll{overflow:auto;max-height:560px}
.fail-list li{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line)}
.fail-list{list-style:none;margin:0;padding:0}
.fail-list a{color:inherit;text-decoration:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font:inherit;border:0;background:#fff;padding:6px 12px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--ink);color:#fff}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.pending{text-align:center;padding:40px 20px;color:var(--muted)}
.pending h2{color:var(--ink)}
.note{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.6}

.info{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;border:1px solid #9ca3af;color:#6b7280;font-size:11px;font-weight:700;cursor:pointer;margin-left:6px;vertical-align:middle;background:#fff;font-family:Georgia,serif;font-style:italic}
.info:hover{border-color:var(--cur);color:var(--cur)}
.hint-bg{position:fixed;inset:0;background:rgba(17,24,39,.45);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:50;overflow:auto}
.hint.hint-wide{max-width:980px}
.hint{background:#fff;border-radius:12px;max-width:860px;width:100%;padding:20px 22px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.hint h3{margin:0 0 4px;font-size:17px}.hint table{margin-top:10px}.hint td,.hint th{white-space:normal;text-align:left;vertical-align:top;line-height:1.5}
.hint .x{float:right;border:0;background:none;font-size:22px;cursor:pointer;color:#6b7280;line-height:1}
.hint .how{background:#f9fafb;border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.6;margin-top:10px}
</style>

function ebitAnalysis(){

      const rows=D.shops.map(s=>{const r=(M.shops[s.shop]||{})[p]; return {name:s.name.replace('True Shop ',''), v:r&&r.req?r.save/r.req*100:null, r};});
      const r=shopRank(rows,92,RT.pass,x=>`%Save ${x.v.toFixed(1)}% (Req ${x.r.req}, ยกเลิก ${x.r.cancel})`); good.push(...r.good); bad.push(...r.bad);
      const a=retRec(RT.cur,state.branch,p), b=M.bench[p];
      if(a&&b){ const ps=a.save/a.req*100, pu=b.UPC.save/b.UPC.req*100, rv=a.rev_req?a.rev_save/a.rev_req*100:null;
        (ps>=pu?good:bad).unshift(`%Save ${ps.toFixed(1)}% ${ps>=pu?'สูงกว่า':'ต่ำกว่า'}ค่าเฉลี่ย UPC ${pu.toFixed(1)}%`);
        if(rv!=null&&rv<ps-1.5) bad.push(`%Rev Save ${rv.toFixed(1)}% ต่ำกว่า %Save — ลูกค้าที่หลุดเป็นกลุ่มค่าบริการสูง`);
        if(rv!=null&&rv>ps+1.5) good.push(`%Rev Save ${rv.toFixed(1)}% สูงกว่า %Save — รักษาลูกค้าค่าบริการสูงได้ดี`); }
      const lost=rows.filter(x=>x.r).sort((a,b)=>b.r.cancel-a.r.cancel).slice(0,3).map(x=>`${x.name} ${x.r.cancel}`); if(lost.length) note=`<div class="note">สาขาที่มีจำนวนยกเลิกมากที่สุด: ${lost.join(' · ')}</div>`;
    } else { const k=SKEY[i-3]; if(!SV) return lists([],[]);
      const rows=D.shops.map(s=>{const r=(SV.shops[s.shop]||{})[k]; return {name:s.name.replace('True Shop ',''), v:r&&r.den?r.num/r.den*100:null, r};});
      const r=shopRank(rows,SV.pass[k]+3,SV.pass[k],x=>`${x.v.toFixed(1)}% (ฐาน ${Math.round(x.r.den)})`); good.push(...r.good); bad.push(...r.bad);
      const v=svcPct(state.branch,k), b=SV.bench[k], pu=b&&b.UPC.den?b.UPC.num/b.UPC.den*100:null;
      if(v!=null&&pu!=null) (v>=pu?good:bad).unshift(`${k} ${v.toFixed(1)}% ${v>=pu?'สูงกว่า':'ต่ำกว่า'}ค่าเฉลี่ย UPC ${pu.toFixed(1)}% (เกณฑ์ ${SV.pass[k]}%)`);
      const miss=rows.filter(x=>x.v==null).length; if(miss&&state.branch==='ALL') note=`<div class="note">${miss} สาขาไม่มีข้อมูล ${k}${k==='Service Level'?' (ไม่มีระบบคิว)':''}</div>`;
    }
    return lists(good.slice(0,8), bad.slice(0,9)) + note;
  });
}
function longevityAnalysis(){
  return analysisCard('longevity', PILLARS[3].items, i=>{
    const k=LKEY[i], K=LN&&LN.kpis[k]; if(!K) return lists([],[])+'<div class="note">รอไฟล์ข้อมูล</div>';
    const good=[], bad=[];
    const rows=D.shops.map(s=>{const v=lonVal(s.shop,k); const raw=(LN.shops[s.shop]||{})[k]; return {name:s.name.replace('True Shop ',''), v:v&&v.idx, lab:v&&v.lab, raw};});
    const r=shopRank(rows,110,K.mode==='target'?50:85,x=>`${x.lab} (ดัชนี ${x.v.toFixed(0)})`); good.push(...r.good); bad.push(...r.bad);
    const zero=rows.filter(x=>x.raw&&x.raw.num===0&&K.mode!=='avg_inv');
    if(zero.length&&state.branch==='ALL'){ bad.splice(0, bad.length, ...bad.filter(t=>!zero.some(z=>t.startsWith('<b>'+z.name+'</b>')))); bad.unshift(`<b>${zero.length} สาขา</b> ยังไม่มียอดเลย: ${zero.map(x=>x.name).join(', ')}`); }
    const v=lonVal(state.branch,k); const ub=K.bench.UPC;
    if(v&&ub&&ub.den){ const own=v.idx; const upcA = K.mode==='target' ? ub.num/(ub.den*K.frac)*100 : null;
      if(upcA!=null) (own>=upcA?good:bad).unshift(`ทำได้ ${own.toFixed(0)}% ของ Target ถึงวันนี้ ${own>=upcA?'สูงกว่า':'ต่ำกว่า'} UPC (${upcA.toFixed(0)}%)`);
      else (own>=100?good:bad).unshift(`${v.lab} ${own>=100?'ดีกว่า':'แย่กว่า'}ค่าเฉลี่ย UPC (${(ub.num/ub.den*100).toFixed(1)}%)`); }
    return lists(good.slice(0,8), bad.slice(0,9));
  });
}

  Object.keys(n.dims).filter(d=>!skip.includes(d)&&ref&&ref.dims[d]).forEach(d=>{
    Object.entries(n.dims[d]).forEach(([val,x])=>{ if(/NOT_CLASSIFIED|ว่าง|^OTHER$|^None$/i.test(val)) return;
      const so=x[0]/tot*100, u=ref.dims[d][val], su=u&&refT?u[0]/refT*100:0;
      if(x[0]>=2 && so-su>=10) good.push(`<b>${val}</b> (${dimLbl[d]||d}) ${fmtN(x[0])} รายการ = ${so.toFixed(0)}% ของยอด (ทีม ${su.toFixed(0)}%)`);
    });
    Object.entries(ref.dims[d]).forEach(([val,u])=>{ if(/NOT_CLASSIFIED|ว่าง|^OTHER$|^None$/i.test(val)) return;
      const su=refT?u[0]/refT*100:0, x=n.dims[d][val]||[0,0], so=x[0]/tot*100;
      if(su>=8 && su-so>=10) bad.push(`<b>${val}</b> (${dimLbl[d]||d}) ${so.toFixed(0)}% ของยอด ต่ำกว่าทีม (${su.toFixed(0)}%)`);
    });
  });
  let tbl='';
  if(MX[p]&&MX[p].months[D.cur]){ const ax=MX[p].axes.map(x=>({x, ...(empAxis(p,id,x,mode)||{a:0,t:0,v:null})})).filter(z=>z.a||z.t);
    ax.forEach(z=>{ if(z.t>=1&&z.v!=null){ if(z.v>=100&&z.a>0) good.push(`<b>${z.x}</b> ทำได้ ${z.v.toFixed(0)}% ของ Target แบรนด์ (ประมาณ)`); else if(z.v<50) bad.push(`<b>${z.x}</b> ทำได้ ${z.v.toFixed(0)}% ของ Target แบรนด์ (ประมาณ ${fmtN(z.t)})`); } });
    tbl+=`<details open style="margin-top:8px"><summary style="cursor:pointer;font-weight:600">เทียบ Target รายแบรนด์ (ค่าประมาณ)</summary><table style="margin-top:6px"><thead><tr><th>แบรนด์</th><th>ยอดจริง</th><th>Target ประมาณ ถึงวันนี้</th><th>%</th></tr></thead><tbody>
      ${ax.map(z=>`<tr><td style="text-align:left"><b>${z.x}</b></td><td>${fmtN(z.a)}</td><td>${fmtN(z.t)}</td><td><span class="pill p-${cls(z.v)}">${fmtP(z.v)}</span></td></tr>`).join('')}</tbody></table>
      <div class="note">Target ประมาณ = Target แบรนด์ของสาขา × สัดส่วน Indy Target ${p} ของคนนี้ในสาขา (${((empShare(p,id)||0)*100).toFixed(0)}%) · ${mode==='q'?'QTY':'Net ฿'}</div></details>`; }
  if(n.dims['สินค้า']){
    const it=Object.entries(n.dims['สินค้า']).sort((x,y)=>y[1][1]-x[1][1]);
    tbl=`<details open style="margin-top:8px"><summary style="cursor:pointer;font-weight:600">สินค้าที่ขาย (${it.length} รายการ)</summary><div class="scroll" style="max-height:320px"><table style="margin-top:6px"><thead><tr><th>สินค้า</th><th>แบรนด์</th><th>ประเภท</th><th>จำนวน</th><th>Net ฿</th></tr></thead><tbody>
      ${it.map(([k,x])=>{const z=itemSplit(k); return `<tr><td style="text-align:left">${z.m}</td><td style="text-align:left">${z.b}</td><td style="text-align:left">${z.c}</td><td>${fmtN(x[0])}</td><td>${fmtN(x[1])}</td></tr>`;}).join('')}</tbody></table></div></details>`;
  }
  const show = p==='Postpay'?['เบอร์มงคล','ACTIVITY_GROUP','CAMPAIGN_GROUP_LV1','NET_RC_TIER','GP_SKU']: p==='True Online'?['RC_TIER','FLAG_BUNDLE','TECHNOLOGY']: p==='True Visions'?['SUB_PRODUCT']: ['BRAND','SUB_CATEGORY','PRICE_TIER'];
  show.filter(d=>n.dims[d]).forEach(d=>{
    const rows=Object.entries(n.dims[d]).sort((x,y)=>y[1][0]-x[1][0]);
    tbl+=`<details ${d==='เบอร์มงคล'?'open':''} style="margin-top:8px"><summary style="cursor:pointer;font-weight:600">${dimLbl[d]||d}</summary><table style="margin-top:6px"><thead><tr><th>${dimLbl[d]||d}</th><th>จำนวน</th><th>Net ฿</th><th>สัดส่วน</th><th>ทีม Upper North</th></tr></thead><tbody>
      ${rows.map(([val,x])=>{const u=ref&&ref.dims[d]&&ref.dims[d][val]; const su=u&&refT?u[0]/refT*100:null; const so=x[0]/tot*100; return `<tr><td style="text-align:left"><b>${val}</b></td><td>${fmtN(x[0])}</td><td>${fmtN(x[1])}</td><td>${so.toFixed(0)}%</td><td>${su==null?'–':su.toFixed(0)+'%'}</td></tr>`;}).join('')}</tbody></table></details>`;
  });
  return `<h4 style="margin:16px 0 4px">${p} <span style="font-weight:400;color:var(--muted);font-size:12px">· ${fmtN(tot)} รายการ · ${fK(n.dims.ALL.ALL[1])} ฿ (All Product ถึง ${AP_ASOF[p]||'-'})</span></h4>${lists(good.slice(0,7), bad.slice(0,7))}${tbl}`;
}
function showStaff(id, p){
  const e=C.staff[id]; if(!e) return; const prods = p&&p!=='ALL' ? [p] : D.products;
  const el=document.createElement('div'); el.className='hint-bg';
  el.innerHTML=`<div class="hint hint-wide" role="dialog"><button class="x" aria-label="ปิด">×</button><h3>${e.name}</h3><div class="sub">${e.role} · ${nameOf(e.shop)} · ${CUR} · เทียบกับทีม Upper North</div>
    ${p&&p!=='ALL'?`<div style="margin-top:6px"><button onclick="this.closest('.hint-bg').remove();showStaff('${id}','ALL')" style="font:inherit;font-size:12px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 10px;cursor:pointer">ดูทุกสินค้า</button></div>`:''}
    ${prods.map(x=>staffSection(id,x)).join('')}
    <div class="how">% เทียบ Indy Target ใช้ยอดเดียวกับหน้า Staff Productivity · รายละเอียดแยกประเภท / สินค้า / เบอร์มงคล มาจาก All Product Rawdata ตาม SALE_ID (ไม่นับ Suspend / Terminate) · "ทีม" = สัดส่วนของทั้ง Upper North</div></div>`;
  const close=()=>el.remove(); el.onclick=ev=>{ if(ev.target===el||ev.target.classList.contains('x')) close(); };
  document.addEventListener('keydown',function k(ev){ if(ev.key==='Escape'){close();document.removeEventListener('keydown',k);} });
  document.body.appendChild(el); wrapTables(el);
}
/* estimated staff brand target = shop brand target x (staff Indy target / shop staff Indy target total); Net share, QTY share if Net target is 0 */
function empShare(prod,id){ const e=C.staff[id]; if(!e) return null;
  const tot=k=>Object.values(C.staff).filter(x=>x.shop===e.shop).reduce((s,x)=>s+((x.p[prod]||{})[k]||0),0);
  const r=e.p[prod]||{}; const tn=tot('tn'), tq=tot('tq');
  return tn>0 ? (r.tn||0)/tn : tq>0 ? (r.tq||0)/tq : null; }
function empAxis(prod,id,ax,mode){ // {a, t (to date), v}
  const X=MX[prod], M=X&&X.months[D.cur], e=C.staff[id], k_=mode==='q'?0:1; if(!M||!e) return null;
  const n=empNode(prod,id); let a=0; if(n&&n.dims.BRAND) Object.entries(n.dims.BRAND).forEach(([b,x])=>{ if((X.axes.includes(b)?b:'อื่นๆ')===ax) a+=x[k_]; });
  const sh=empShare(prod,id), st=M.shops[e.shop]&&M.shops[e.shop][ax]; const t = sh!=null&&st ? st[k_+2]*sh*M.frac : 0;
  return {a, t, v: t? a/t*100 : null}; }
function mixStaffTable(pid){
  const prod=MIXP[pid], X=MX[prod], mode=state.mode, k_=mode==='q'?0:1, list=shopsOf(state.branch);
  const ids=Object.keys(C.staff).filter(id=>list.includes(C.staff[id].shop));
  const rows=ids.map(id=>{ const e=C.staff[id], by={}; X.axes.forEach(a=>by[a]=empAxis(prod,id,a,mode)||{a:0,t:0,v:null});
    const tot=Object.values(by).reduce((s,x)=>s+x.a,0), r=e.p[prod], t=(r['t'+mode]||0)*frs(C,prod), a=r['a'+mode]||0;
    return {id,e,by,tot,v:t?a/t*100:null}; }).filter(x=>x.tot>0||x.v!=null).sort((x,y)=>y.tot-x.tot);
  return `<div class="card" style="margin-top:16px"><h3>Staff Ranking · ${prod}</h3><div class="sub">เรียงจากยอดรวมสูงสุด · ${mode==='q'?'จำนวนชิ้น':'Net ฿'} รายแบรนด์ จาก All Product Rawdata (ถึง ${AP_ASOF[prod]||'-'}) · % Indy = ยอด ${prod} ทั้งหมด ÷ Indy Target ถึงวันนี้</div>
  <div class="scroll"><table class="hm"><thead><tr><th>#</th><th>พนักงาน</th><th style="text-align:center">รวม</th><th style="text-align:center">% Indy</th>${X.axes.map(a=>`<th style="text-align:center">${a}</th>`).join('')}</tr></thead><tbody>
  ${rows.map((r,i)=>`<tr><td>${i+1}</td><td style="text-align:left">${r.e.name}${moreBtn(r.id,prod)}<div style="font-size:11px;color:var(--muted)">${nameOf(r.e.shop)}</div></td><td class="c"><b>${fmtN(r.tot)}</b></td><td class="c"><span class="pill p-${cls(r.v)}">${fmtP(r.v)}</span></td>${X.axes.map(a=>{const z=r.by[a]; return `<td class="c" style="${hmColor(z.v)}" title="ยอด ${fmtN(z.a)} / Target ประมาณ ${fmtN(z.t)}">${z.v==null?'–':z.v.toFixed(0)+'%'}<div style="font-size:10px;font-weight:400">${fmtN(z.a)} / ${fmtN(z.t)}</div></td>`;}).join('')}</tr>`).join('')}</tbody></table></div>
  <div class="note">ช่องแบรนด์ = % เทียบ <b>Target แบรนด์รายคน (ค่าประมาณ)</b> · ตัวเลขเล็ก = ยอดจริง / Target ประมาณ ถึงวันนี้ · Target ประมาณ = Target แบรนด์ของสาขา × สัดส่วน Indy Target ${prod} ของคนนั้นในสาขา (ใช้ Net ถ้า Indy Target Net เป็น 0 ใช้ QTY) · แสดงเฉพาะพนักงานที่มี Indy Target</div></div>`;
}
function pendingView(id){ const p=PILLARS.find(x=>x.id===id); return `<div class="card pending"><h2>${p.name}</h2><p>รอข้อมูล${p.items.length?': '+p.items.join(' · '):''}</p></div>`; }

/* ---------- router ---------- */
function render(){
  const id=(location.hash||'#summary').slice(1);
  document.getElementById('nav').innerHTML=[{id:'summary',name:'Summary'}].concat(PILLARS).map(p=>`<a href="#${p.id}" class="${p.id===id?'on':''}">${p.name}</a>`).join('');
  const P_=PILLARS.find(p=>p.id===id);
  document.getElementById('app').innerHTML = !P_?summary(): P_.pending?pendingView(id): id==='sale'?detailSale(): id==='ebit'?detailEbit(): id==='service'?detailService(): id==='longevity'?detailLongevity(): MIXP[id]?detailMix(id):detailStaff();
  wrapTables(document.getElementById('app'));
}
function wrapTables(root){ (root||document).querySelectorAll('table').forEach(t=>{ const p=t.parentElement; if(p.classList.contains('scroll')||p.classList.contains('tw')) return; const w=document.createElement('div'); w.className='tw'; p.insertBefore(w,t); w.appendChild(t); }); }
function go(id){location.hash=id;}
function pick(b){state.branch=b;document.getElementById('branch').value=b;render();}
function setMode(m){state.mode=m;render();}
document.getElementById('period').textContent=`${CUR} · ${D.shops.length} สาขา · อัปเดต 14 พ.ย. 2569 03:31 น.`;
const sel=document.getElementById('branch');
sel.innerHTML='<option value="ALL">ทั้งหมด (Upper North)</option>'+D.shops.map(s=>`<option value="${s.shop}">${s.name.replace('True Shop ','')}</option>`).join('');
sel.onchange=e=>{state.branch=e.target.value;render();};
window.addEventListener('hashchange',()=>{render();scrollTo(0,0);});
render();
</script>
