<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Upper North Shop Performance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f6f8; --card:#fff; --ink:#1b1f24; --muted:#6b7280; --line:#e5e7eb;
  --cur:#e4002b; --prev:#94a3b8; --target:#1b1f24;
  --good:#16a34a; --goodbg:#dcfce7; --warn:#d97706; --warnbg:#fef3c7; --bad:#dc2626; --badbg:#fee2e2;
}
*{box-sizing:border-box}
body{margin:0;font-family:"IBM Plex Sans Thai",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.hwrap{max-width:1500px;margin:0 auto;padding:12px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.brand{font-weight:700;font-size:18px}
.brand small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.spacer{flex:1}
select{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
nav{max-width:1500px;margin:0 auto;padding:0 20px;display:flex;gap:4px;overflow-x:auto}
nav a{padding:10px 14px;text-decoration:none;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;font-weight:500}
nav a.on{color:var(--ink);border-color:var(--cur)}
main{max-width:1500px;margin:0 auto;padding:20px}
.banner{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;padding:8px 12px;border-radius:8px;margin-bottom:16px;font-size:13px}
.grid{display:grid;gap:16px}
.g5{grid-template-columns:repeat(4,1fr)}
.radars .card{padding:12px}
.g2{grid-template-columns:1.25fr 1fr}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:1200px){.g5{grid-template-columns:repeat(3,1fr)}}
@media(max-width:1000px){.g5{grid-template-columns:repeat(2,1fr)}.g2,.g4{grid-template-columns:1fr}}
@media(max-width:600px){.g5{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.card h3{margin:0 0 4px;font-size:15px}
.card .sub{color:var(--muted);font-size:12px;margin-bottom:8px}
.tile{cursor:pointer;transition:box-shadow .15s}
.tile:hover{box-shadow:0 4px 14px rgba(0,0,0,.08)}
.tile .lbl{color:var(--muted);font-size:12.5px}
.tile .val{font-size:28px;font-weight:700;margin:2px 0}
.tile .d{font-size:12.5px}
.up{color:var(--good)} .down{color:var(--bad)}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600}
.p-good{background:var(--goodbg);color:var(--good)}.p-warn{background:var(--warnbg);color:var(--warn)}.p-bad{background:var(--badbg);color:var(--bad)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:5px;border-radius:2px}
.radar text{font-family:inherit}
.mini{cursor:pointer}
.mini:hover{box-shadow:0 4px 14px rgba(0,0,0,.08)}
.mini .go{font-size:12px;color:var(--cur);font-weight:600}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:500;font-size:12px;background:#fafafa;position:sticky;top:0}
.hm td.c{text-align:center;font-weight:600;font-size:12px}
.hm tr:hover td{outline:0;background-image:linear-gradient(rgba(0,0,0,.03),rgba(0,0,0,.03))}
.hm td:first-child{cursor:pointer}
.scroll{overflow:auto;max-height:560px}
.fail-list li{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line)}
.fail-list{list-style:none;margin:0;padding:0}
.fail-list a{color:inherit;text-decoration:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font:inherit;border:0;background:#fff;padding:6px 12px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--ink);color:#fff}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.pending{text-align:center;padding:40px 20px;color:var(--muted)}
.pending h2{color:var(--ink)}
.note{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.6}

.info{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;border:1px solid #9ca3af;color:#6b7280;font-size:11px;font-weight:700;cursor:pointer;margin-left:6px;vertical-align:middle;background:#fff;font-family:Georgia,serif;font-style:italic}
.info:hover{border-color:var(--cur);color:var(--cur)}
.hint-bg{position:fixed;inset:0;background:rgba(17,24,39,.45);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:50;overflow:auto}
.hint{background:#fff;border-radius:12px;max-width:860px;width:100%;padding:20px 22px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.hint h3{margin:0 0 4px;font-size:17px}.hint table{margin-top:10px}.hint td,.hint th{white-space:normal;text-align:left;vertical-align:top;line-height:1.5}
.hint .x{float:right;border:0;background:none;font-size:22px;cursor:pointer;color:#6b7280;line-height:1}
.hint .how{background:#f9fafb;border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.6;margin-top:10px}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div class="brand">Upper North · Shop Performance<small id="period"></small></div>
    <div class="spacer"></div>
    <label>สาขา&nbsp;<select id="branch"></select></label>
  </div>
  <nav id="nav"></nav>
</header>
<main id="app"></main>
<script id="perf-data" type="application/json">__DATA__</script>
<script>
const D = JSON.parse(document.getElementById('perf-data').textContent);
const TH = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const mLbl = m => `${TH[+m.slice(5)-1]} ${+m.slice(0,4)+543}`;
const CUR = mLbl(D.cur), PREV = mLbl(D.prev);
const C = D.months[D.cur], P = D.months[D.prev] || null;
const PILLARS = [
  {id:'sale', name:'Sale', th:'ยอดขาย', basis:'เทียบ Target สาขา (ถึงวันนี้)', items:D.products},
  {id:'service', name:'Service & Retention', th:'บริการและรักษาฐานลูกค้า', basis:'เทียบเกณฑ์ผ่าน: Retention 88% · SL 85% · iCsat 92% · On Time 95%', pending:!D.ret&&!D.svc, items:['Ret. Postpay','Ret. TOL','Ret. TVS','Service Level','iCsat','On Time']},
  {id:'ebit', name:'EBIT & Revenue', th:'กำไรและรายได้', basis:'ต่อ ตร.ม. / ต่อคน เทียบค่าเฉลี่ย UPC ประเภทเดียวกัน', items:(D.pl&&D.pl.axes)||[], pending:!D.pl},
  {id:'longevity', name:'Sale Longevity', th:'สินค้าต่อยอด', basis:'TMC / Ext. Warranty / Customer Hub เทียบ Target · Trade In / Down Sell เทียบค่าเฉลี่ย UPC', pending:!D.lon, items:['TMC','Ext. Warranty','Trade In','Customer Hub','Down Sell']},
  {id:'staff', name:'Staff Productivity', th:'ผลิตภาพพนักงาน', basis:'ยอดพนักงาน เทียบ Indy Target (ถึงวันนี้)', items:D.products},
  {id:'brand', name:'Device by Brand', th:'Device รายแบรนด์', basis:'ยอดแต่ละแบรนด์ เทียบ Target by Brand (ถึงวันนี้)', pending:!(D.mix&&D.mix.Device), items:(D.mix&&D.mix.Device&&D.mix.Device.axes)||[]},
  {id:'giamix', name:'GIA', th:'GIA รายแบรนด์', basis:'ยอดแต่ละแบรนด์ เทียบ Target GIA (ถึงวันนี้)', pending:!(D.mix&&D.mix.GIA), items:(D.mix&&D.mix.GIA&&D.mix.GIA.axes)||[]}
];
const MX = D.mix||{}, MIXP = {brand:'Device', giamix:'GIA'};
// [aq, an, tq, tn] summed over shops for one axis
const mixSum = (prod,m,br,ax) => { const M=MX[prod]&&MX[prod].months[m]; if(!M) return null; const o=[0,0,0,0]; shopsOf(br).forEach(s=>{const r=M.shops[s]&&M.shops[s][ax]; if(r) r.forEach((v,i)=>o[i]+=v);}); return o; };
const mixAch = (prod,m,br,ax,mode) => { const o=mixSum(prod,m,br,ax), M=MX[prod]&&MX[prod].months[m]; if(!o) return null; const a=mode==='q'?o[0]:o[1], t=mode==='q'?o[2]:o[3]; return t? a/(t*M.frac)*100 : null; };
const mixVals = (prod,m,br,mode) => (MX[prod]?MX[prod].axes:[]).map(ax=>mixAch(prod,m,br,ax,mode||state.mode));
const SHORT = {'Postpay':'Postpay','True Online':'TOL','Device':'Device','GIA':'GIA','True Visions':'TVS'};
let state = {branch:'ALL', mode:'n'};

/* ---------- calc ---------- */
// achievement % for a month: actual / (target x frac). null when no actual for that product.
function shopAch(M, shopList, p, mode){
  if(!M || !M.actual_products.includes(p)) return null;
  let a=0,t=0; shopList.forEach(s=>{const r=M.shops[s]&&M.shops[s][p]; if(r){a+=r['a'+mode]||0;t+=r['t'+mode]||0;}});
  return t? a/(t*fr(M,p))*100 : null;
}
function staffAch(M, shopList, p, mode){
  if(!M || !M.has_ind || !(M.staff_products||M.actual_products).includes(p)) return null;
  let a=0,t=0; Object.values(M.staff).forEach(e=>{ if(!shopList.includes(e.shop)) return; const r=e.p[p]; a+=r['a'+mode]||0; t+=r['t'+mode]||0; });
  return t? a/(t*frs(M,p))*100 : null;
}
const frs = (M,p) => (M.frac_sp && M.frac_sp[p]) || fr(M,p);
const fr = (M,p) => (M.frac_p && M.frac_p[p]) || M.frac;
const shopsOf = br => br==='ALL' ? D.shops.map(s=>s.shop) : [br];
function pillarVals(pid, M, br, mode){
  const P_ = PILLARS.find(x=>x.id===pid); const f = pid==='staff'?staffAch:shopAch;
  return P_.items.map(p=>f(M, shopsOf(br), p, mode||state.mode));
}
const avg = v => { const x=v.filter(z=>z!=null); return x.length? x.reduce((s,z)=>s+Math.min(150,z),0)/x.length : null; };
const cls = v => v==null?'':v>=100?'good':v>=90?'warn':'bad';
const fmtP = v => v==null?'–':v.toFixed(0)+'%';
const fmtN = v => v==null?'–':Math.round(v).toLocaleString('th-TH');
const delta = (c,p) => (c==null||p==null)?'<span style="color:var(--muted)">–</span>':`<span class="${c>=p?'up':'down'}">${c>=p?'▲':'▼'} ${Math.abs(c-p).toFixed(1)} pt</span>`;
const hmColor = v => v==null?'background:#f3f4f6;color:#9ca3af':v>=100?`background:rgba(22,163,74,${Math.min(.55,.15+(v-100)/80)})`:v>=90?'background:#fde68a':`background:rgba(220,38,38,${Math.min(.75,.25+(90-v)/50)});color:${v<75?'#fff':'#1b1f24'}`;

/* ---------- radar ---------- */
function radar(labels, series, opt={}){
  const W=opt.w||460,H=opt.h||380,cx=W/2,cy=H/2+4,R=Math.min(W,H)/2-(opt.pad||70),MAX=150,n=labels.length;
  const ang=i=>-Math.PI/2+i*2*Math.PI/n;
  const pt=(i,v)=>{const r=R*Math.max(0,Math.min(MAX,v))/MAX;return [cx+r*Math.cos(ang(i)),cy+r*Math.sin(ang(i))];};
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" style="display:block;margin:auto;max-width:${opt.small?320:470}px">`;
  [50,100,150].forEach(lv=>{
    s+=`<polygon points="${labels.map((_,i)=>pt(i,lv).join(',')).join(' ')}" fill="none" stroke="${lv===100?'#111827':'#e5e7eb'}" stroke-width="${lv===100?1.6:1}" ${lv===100?'stroke-dasharray="7 4"':''}/>`;
    if(!opt.small&&lv<150) s+=`<text x="${cx+4}" y="${cy-R*lv/MAX+12}" font-size="10" fill="#9ca3af">${lv}%</text>`;
  });
  labels.forEach((_,i)=>{const [x,y]=pt(i,MAX);s+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#e5e7eb"/>`;});
  series.forEach(se=>{
    const idx=se.values.map((v,i)=>v==null?null:i).filter(i=>i!=null);
    if(idx.length>=2) s+=`<polygon points="${idx.map(i=>pt(i,se.values[i]).join(',')).join(' ')}" fill="${se.color}" fill-opacity="${se.fill??.15}" stroke="${se.color}" stroke-width="${se.width||2}" ${se.dash?`stroke-dasharray="${se.dash}"`:''}/>`;
    if(se.dots) idx.forEach(i=>{const v=se.values[i],[x,y]=pt(i,v);s+=`<circle cx="${x}" cy="${y}" r="${se.prev?(opt.small?2:2.5):(opt.small?3:4)}" fill="${se.prev?se.color:(v<100?'#dc2626':se.color)}" stroke="#fff" stroke-width="1.5" r-x="${se.prev?1:0}"><title>${labels[i]}: ${v.toFixed(1)}%</title></circle>`;});
  });
  labels.forEach((l,i)=>{
    const [x,y]=pt(i,MAX+(opt.small?20:24)); const a=Math.cos(ang(i)); const anc=Math.abs(a)<.2?'middle':a>0?'start':'end';
    const v=series[0].values[i]; const lab=series[0].labels&&series[0].labels[i];
    s+=`<text x="${x}" y="${y}" text-anchor="${anc}" dominant-baseline="middle" font-size="${opt.small?10.5:12.5}" font-weight="500" fill="#1b1f24">${l}</text>`;
    s+=`<text x="${x}" y="${y+(opt.small?13:15)}" text-anchor="${anc}" dominant-baseline="middle" font-size="${opt.small?10.5:11.5}" font-weight="700" fill="${v==null?'#9ca3af':v>=100?'#16a34a':v>=90?'#d97706':'#dc2626'}">${v==null?'รอข้อมูล':(lab||v.toFixed(0)+'%')}</text>`;
  });
  return s+'</svg>';
}
const hasPrev = pid => P && pillarVals(pid,P,state.branch).some(v=>v!=null);
const BENCH = {brand:'Target แบรนด์ ถึงวันนี้', giamix:'Target แบรนด์ ถึงวันนี้', sale:'Target ถึงวันนี้', staff:'Indy Target ถึงวันนี้', ebit:'ค่าเฉลี่ย UPC', service:'เกณฑ์ผ่าน', longevity:'Target / ค่าเฉลี่ย UPC'};
const ico = (stroke,dash,w) => `<svg width="22" height="8" style="vertical-align:middle;margin-right:4px"><line x1="1" y1="4" x2="21" y2="4" stroke="${stroke}" stroke-width="${w}" ${dash?`stroke-dasharray="${dash}"`:''}/></svg>`;
const legendFor = (pid, small) => { const pl = pid==='ebit', rt = pid==='service', ln = pid==='longevity';
  const mx = MIXP[pid], mxa = mx&&MX[mx]&&MX[mx].months[D.cur]&&MX[mx].months[D.cur].asof;
  const c = mx ? `${CUR}${small?'':` (ถึง ${mxa?+mxa.slice(8):'-'} ${TH[+D.cur.slice(5)-1]})`}` : ln ? `${mLbl(LN.month)}${small?'':' (ถึง '+(+((Object.values(LN.kpis).map(k=>k.asof).sort().pop()||'').slice(8)))+')'}` : rt ? `${mLbl((RT&&RT.cur)||SV.month)}${small?'':' (ถึง '+(+(([...(RT?Object.values(RT.months[RT.cur].asof):[]),...(SV?Object.values(SV.asof):[])].filter(Boolean).sort().pop()||'').slice(8)))+')'}` : pl ? plLbl(PL.last) : `${CUR}${small?'':` (ถึง ${C.last_day?+C.last_day.slice(8):'-'} ${TH[+D.cur.slice(5)-1]})`}`;
  const p = rt ? (RT.prev?mLbl(RT.prev):'ยังไม่มีข้อมูล') : pl ? plLbl(PL.prev) : PREV;
  return `<div class="legend" style="justify-content:center;margin-top:4px;gap:${small?'4px 10px':'14px'};font-size:${small?11:12}px"><span>${ico('#e4002b','',3)}${c}</span>${rt||ln?'':`<span>${ico('#475569','2 3',2)}${p}</span>`}<span>${ico('#111827','7 4',1.6)}${small?'':'100 = '}${BENCH[pid]}</span></div>`; };
const legend = () => `<div class="legend"><span><i style="background:var(--cur)"></i>${CUR} (ถึง ${C.last_day?+C.last_day.slice(8):'-'} ${TH[+D.cur.slice(5)-1]})</span><span><i style="background:var(--prev)"></i>${PREV} ${hasPrev('sale')?'':'(ยังไม่มีข้อมูล)'}</span><span><i style="background:none;border-top:2px dashed #1b1f24;height:0"></i>100% = Target</span></div>`;
const PL = D.pl; const plVals = (m,br) => { const M=PL&&PL.months[m]; if(!M) return []; if(br==='ALL') return M.area_idx; const r=M.shops[br]; return (r&&r.idx)||PL.axes.map(()=>null); };
const plLbl = m => m?mLbl(m):'-';
const RT = D.ret; const RKEY = ['Postpay','True Online','True Visions'];
const retRec = (m,br,p) => { const M=RT&&m&&RT.months[m]; if(!M) return null; const r = br==='ALL' ? M.area[p] : (M.shops[br]||{})[p]; return r&&r.req? r : null; };
const retPct = (m,br,p) => { const r=retRec(m,br,p); return r? r.save/r.req*100 : null; };
const SV = D.svc; const SKEY = ['Service Level','iCsat','On Time'];
const svcRec = (br,k) => { if(!SV) return null; const r = br==='ALL' ? SV.area[k] : (SV.shops[br]||{})[k]; return r&&r.den? r : null; };
const svcPct = (br,k) => { const r=svcRec(br,k); return r? r.num/r.den*100 : null; };
const retVals = (m,br) => [...RKEY.map(p=>{const v=RT?retPct(m,br,p):null; return v==null?null:v/RT.pass*100;}), ...SKEY.map(k=>{const v=svcPct(br,k); return v==null?null:v/SV.pass[k]*100;})];
const retLabs = (m,br) => [...RKEY.map(p=>{const v=RT?retPct(m,br,p):null; return v==null?null:v.toFixed(1)+'%';}), ...SKEY.map(k=>{const v=svcPct(br,k); return v==null?null:v.toFixed(1)+'%';})];
const LN = D.lon; const LKEY = ['True Mobile Care','Extended Warranty','Trade In','Customer Hub','Down Sell'];
const lonRec = (br,k) => { const K=LN&&LN.kpis[k]; if(!K) return null; const r = br==='ALL' ? K.area : (LN.shops[br]||{})[k]; return r&&r.den? r : null; };
const lonRate = z => z&&z.den? z.num/z.den : null;
const lonVal = (br,k) => { const K=LN&&LN.kpis[k], r=lonRec(br,k); if(!K||!r) return null;   // {idx, label}
  if(K.mode==='target'){ const a=r.num/(r.den*K.frac)*100; return {idx:a, lab:a.toFixed(0)+'%'}; }
  const own=lonRate(r), ben=lonRate(K.bench.UPC); if(own==null||!ben) return null;
  return K.mode==='avg' ? {idx:own/ben*100, lab:(own*100).toFixed(1)+'%'} : {idx: own>0? ben/own*100 : 150, lab:(own*100).toFixed(1)+'%'}; };
const seriesFor = (pid,br) => MIXP[pid] ? [{values:mixVals(MIXP[pid],D.cur,br),color:'#e4002b',dots:true},{values:D.prev?mixVals(MIXP[pid],D.prev,br):[],color:'#475569',fill:.04,width:1.8,dash:'2 3',dots:true,prev:true}] : pid==='longevity' ? [{values:LKEY.map(k=>{const v=lonVal(br,k); return v&&v.idx;}),labels:LKEY.map(k=>{const v=lonVal(br,k); return v&&v.lab;}),color:'#e4002b',dots:true}] : pid==='service' ? [{values:retVals(RT.cur,br),labels:retLabs(RT.cur,br),color:'#e4002b',dots:true}] : pid==='ebit' ? [{values:plVals(PL.last,br),color:'#e4002b',dots:true},{values:plVals(PL.prev,br),color:'#475569',fill:.04,width:1.8,dash:'2 3',dots:true,prev:true}] : [{values:pillarVals(pid,C,br),color:'#e4002b',dots:true},{values:P?pillarVals(pid,P,br):[],color:'#475569',fill:.04,width:1.8,dash:'2 3',dots:true,prev:true}];
const modeSeg = () => `<div class="seg"><button class="${state.mode==='n'?'on':''}" onclick="setMode('n')">Net Amount</button><button class="${state.mode==='q'?'on':''}" onclick="setMode('q')">QTY</button></div>`;

/* ---------- hints (ⓘ) ---------- */
const HINT = {

const infoBtn = id => HINT[id] ? `<span class="info" title="ดูวิธีวัด" onclick="event.stopPropagation();showHint('${id}')">i</span>` : '';
function showHint(id){ const h=HINT[id]; const el=document.createElement('div'); el.className='hint-bg';
  el.innerHTML=`<div class="hint" role="dialog"><button class="x" aria-label="ปิด">×</button><h3>${h.title}</h3>
  <table><thead><tr>${h.cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${h.rows.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</tbody></table>
  <div class="how">${h.how}</div></div>`;
  const close=()=>el.remove(); el.onclick=e=>{ if(e.target===el||e.target.classList.contains('x')) close(); };
  document.addEventListener('keydown',function k(e){ if(e.key==='Escape'){close();document.removeEventListener('keydown',k);} });
  document.body.appendChild(el); }

/* shop ranking helper: rows [{name, v, txt}] -> good (>=hi) / bad (<lo) */
function shopRank(rows, hi, lo, fmt){
  const r = rows.filter(x=>x.v!=null).sort((a,b)=>b.v-a.v);
  return { good: r.filter(x=>x.v>=hi).slice(0,4).map(x=>`<b>${x.name}</b> ${fmt(x)}`), bad: r.filter(x=>x.v<lo).reverse().slice(0,5).map(x=>`<b>${x.name}</b> ${fmt(x)}`) };
}
/* breakdown by dimension vs UPC (share of units, units per shop, net per unit, run-rate vs last month) */
function dimAnalysis(product){
  const cm=D.cur, pm=D.prev, scope = state.branch==='ALL' ? 'UN' : state.branch;
  const N = (DM[cm]||{})[product]||{}, own=N[scope], upc=N.UPC, P=((DM[pm]||{})[product]||{})[scope];
  if(!own||!upc) return {good:[],bad:[],html:'<div class="note">ยังไม่มีข้อมูลแยกประเภทของสินค้านี้ (มาจากไฟล์ All Product Rawdata)</div>'};
  const asof = AP_ASOF[product]; const cd = asof&&asof.slice(0,7)===cm ? +asof.slice(8) : C.days_in_month; const pdays = P? new Date(+pm.slice(0,4), +pm.slice(5), 0).getDate() : null;
  const good=[], bad=[]; let html='';
  const dims = Object.keys(own.dims).filter(d=>d!=='ALL' && upc.dims[d]);
  const tot = (n,d)=> (n.dims.ALL||{}).ALL ? n.dims.ALL.ALL[0] : Object.values(n.dims[d]||{}).reduce((s,x)=>s+x[0],0);
  for(const d of dims){
    const oT=tot(own,d), uT=tot(upc,d); if(!oT||!uT) continue;
    const vals = [...new Set([...Object.keys(own.dims[d]), ...Object.keys(upc.dims[d])])]
      .map(v=>{ const o=own.dims[d][v]||[0,0], u=upc.dims[d][v]||[0,0], pr=P&&P.dims[d]&&P.dims[d][v];
        const so=o[0]/oT*100, su=u[0]/uT*100, ps = (o[0]/own.shops)/((u[0]/upc.shops)||NaN)*100;
        const apo = o[0]? o[1]/o[0] : null, apu = u[0]? u[1]/u[0] : null;
        const mom = pr&&pr[0]? (o[0]/cd)/(pr[0]/pdays)*100 : null;
        return {v, o, u, so, su, ps, apo, apu, mom}; })
      .filter(x=>x.su>=1||x.so>=1).sort((a,b)=>b.su-a.su).slice(0,10);
    for(const x of vals){
      if(/NOT_CLASSIFIED|ว่าง|^OTHER$|^ $/i.test(x.v)) continue;  // not actionable: shown in the table only
      const big = x.so>=5||x.su>=5;
      if(big && x.so-x.su>=4) good.push(`<b>${x.v}</b> (${dimLbl[d]||d}) สัดส่วน ${x.so.toFixed(0)}% สูงกว่า UPC ${x.su.toFixed(0)}%`);
      if(big && x.su-x.so>=4) bad.push(`<b>${x.v}</b> (${dimLbl[d]||d}) สัดส่วน ${x.so.toFixed(0)}% ต่ำกว่า UPC ${x.su.toFixed(0)}%`);
      if(scope==='UN' && x.su>=5 && isFinite(x.ps) && x.ps<70) bad.push(`<b>${x.v}</b> (${dimLbl[d]||d}) ขายได้ต่อสาขาเพียง ${x.ps.toFixed(0)}% ของค่าเฉลี่ยสาขา UPC`);

      ${vals.map(x=>`<tr><td><b>${x.v}</b></td><td>${fK(x.o[0])}</td><td>${x.so.toFixed(1)}%</td><td>${x.su.toFixed(1)}%</td><td class="${x.so>=x.su?'up':'down'}">${(x.so-x.su>=0?'+':'')+(x.so-x.su).toFixed(1)} pp</td>${scope==='UN'?`<td>${isFinite(x.ps)?`<span class="pill p-${cls(x.ps)}">${x.ps.toFixed(0)}%</span>`:'–'}</td>`:''}${product==='True Visions'?'':`<td>${fK(x.apo)}</td><td>${fK(x.apu)}</td>`}<td>${x.mom==null?'–':`<span class="${x.mom>=100?'up':'down'}">${x.mom.toFixed(0)}%</span>`}</td></tr>`).join('')}</tbody></table></details>`;
  }
  const uniq = a => [...new Set(a)];
  return {good:uniq(good).slice(0,7), bad:uniq(bad).slice(0,8), html: html + `<div class="note">ข้อมูลแยกประเภทจาก All Product Rawdata (มีถึง ${asof||'-'}) · ${scope==='UN'?`ต่อสาขา vs UPC = ยอดเฉลี่ยต่อสาขาของเรา ÷ ยอดเฉลี่ยต่อสาขาใน UPC × 100 (${own.shops} สาขาเทียบ ${upc.shops} สาขา)`:'มุมมองสาขาเดียวเทียบสัดส่วนกับ UPC (ไม่เทียบปริมาณ เพราะขนาดสาขาต่างกัน)'} · อัตราต่อวัน = ยอดเดือนนี้ต่อวัน ÷ ยอดเดือนก่อนต่อวัน · ไม่นับ Suspend / Terminate และร้าน Partner</div>`};
}

function ebitAnalysis(){
  const M=PL.months[PL.last], br=state.branch;
  const LL = {rev_prod:['รายได้ขายสินค้า',1], rev_svc:['รายได้ขายบริการ (คอมมิชชัน)',1], rev_nonsale:['Non Sale (Retention, Upsell, Renew, SQT, Bill)',1], gm:['GM',1],
    pers:['ค่าพนักงาน',-1], rent:['ค่าเช่า',-1], var:['ต้นทุนผันแปร (MDR, ดอกเบี้ย 0%, WH)',-1], front:['Front Cost รวม',-1], ebitda:['EBITDA',1], ebit:['EBIT',1], tx:['Transaction (รายการ/ตร.ม.)',1]};
  const SEL = [['rev_prod','rev_svc','rev_nonsale','tx'],['gm','rev_svc','rev_nonsale'],['ebitda','ebit','var','front'],['front','pers','rent','var'],['rent'],['gm','pers']];
  return analysisCard('ebit', PL.axes, i=>{
    const lines = br==='ALL' ? M.area_lines : ((M.shops[br]||{}).lines||{});
    const good=[], bad=[];
    const rowsAll = Object.keys(LL).map(k=>{ const [own,ben]=lines[k]||[null,null]; const s=LL[k][1]; const idx= own!=null&&ben ? (s>0? Math.max(0,own/ben*100) : (own>0? ben/own*100 : null)) : null; return {k,own,ben,idx,lbl:LL[k][0],s}; });
    for(const x of rowsAll.filter(x=>SEL[i].includes(x.k))){
      if(x.idx==null) continue;
      const t = x.k==='tx' ? `<b>${x.lbl}</b> ${x.own.toFixed(1)} รายการ/ตร.ม. เทียบ UPC ${x.ben.toFixed(1)} (ดัชนี ${x.idx.toFixed(0)})` : `<b>${x.lbl}</b> ${fK(x.own)} บาท/ตร.ม. เทียบ UPC ${fK(x.ben)} (ดัชนี ${x.idx.toFixed(0)})`;
      if(x.idx>=110) good.push(t); if(x.idx<90) bad.push(t);
    }
    // shops on this axis
    if(br==='ALL'){
      const rows=D.shops.map(s=>{const r=M.shops[s.shop]; return {name:s.name.replace('True Shop ',''), v:r&&r.idx?r.idx[i]:null, r};});
      const r=shopRank(rows,120,80,x=>`ดัชนี ${x.v.toFixed(0)}`); good.push(...r.good); bad.push(...r.bad);
      const loss=D.shops.filter(s=>M.shops[s.shop]&&M.shops[s.shop].ebit<0).map(s=>`<b>${s.name.replace('True Shop ','')}</b> ขาดทุน EBIT ${fK(M.shops[s.shop].ebit)} บาท`);
      if(i===2) bad.unshift(...loss);
    } else { const r=M.shops[br]; if(r&&r.ebit<0) bad.unshift(`สาขานี้ขาดทุน EBIT ${fK(r.ebit)} บาท`); }
    const t = PL.trend; if(t.length>=2){ const a=t[t.length-1], b=t[t.length-2]; const ea=a.ebit/a.rev*100, eb=b.ebit/b.rev*100;
      if(br==='ALL'&&i===2) (ea>=eb?good:bad).push(`EBIT% ภาพรวม ${ea.toFixed(1)}% ${ea>=eb?'ดีขึ้น':'ลดลง'}จาก ${eb.toFixed(1)}% เดือนก่อน`); }
    const tbl=`<table style="margin-top:10px"><thead><tr><th>บรรทัด P&L (ต่อ ตร.ม. / เดือน)</th><th>${br==='ALL'?'Upper North':'สาขา'}</th><th>UPC</th><th>ดัชนี</th></tr></thead><tbody>${rowsAll.map(x=>`<tr ${SEL[i].includes(x.k)?'style="background:#fafafa;font-weight:600"':''}><td>${x.lbl}${x.s<0?' <span style="font-size:11px;color:var(--muted)">(ต่ำ = ดี)</span>':''}</td><td>${x.k==='tx'?(x.own||0).toFixed(1):fK(x.own)}</td><td>${x.k==='tx'?(x.ben||0).toFixed(1):fK(x.ben)}</td><td>${x.idx==null?'–':`<span class="pill p-${cls(x.idx)}">${x.idx.toFixed(0)}</span>`}</td></tr>`).join('')}</tbody></table>
      <div class="note">ค่าเฉลี่ย UPC ถ่วงตามประเภทและพื้นที่ของสาขาเรา · แถวตัวหนา = เกี่ยวกับแกนที่เลือก · ข้อมูล ${plLbl(PL.last)}</div>`;
    return lists(good.slice(0,9), bad.slice(0,10)) + tbl;
  });
}
function serviceAnalysis(){
  const axes=['Ret. Postpay','Ret. TOL','Ret. TVS','Service Level','iCsat','On Time'];
  return analysisCard('service', axes, i=>{
    const good=[], bad=[]; let note='';
    if(i<3){ const p=RKEY[i], M=RT&&RT.months[RT.cur]; if(!M) return lists([],[]);
      const rows=D.shops.map(s=>{const r=(M.shops[s.shop]||{})[p]; return {name:s.name.replace('True Shop ',''), v:r&&r.req?r.save/r.req*100:null, r};});
      const r=shopRank(rows,92,RT.pass,x=>`%Save ${x.v.toFixed(1)}% (Req ${x.r.req}, ยกเลิก ${x.r.cancel})`); good.push(...r.good); bad.push(...r.bad);
      const a=retRec(RT.cur,state.branch,p), b=M.bench[p];
      if(a&&b){ const ps=a.save/a.req*100, pu=b.UPC.save/b.UPC.req*100, rv=a.rev_req?a.rev_save/a.rev_req*100:null;
        (ps>=pu?good:bad).unshift(`%Save ${ps.toFixed(1)}% ${ps>=pu?'สูงกว่า':'ต่ำกว่า'}ค่าเฉลี่ย UPC ${pu.toFixed(1)}%`);
        if(rv!=null&&rv<ps-1.5) bad.push(`%Rev Save ${rv.toFixed(1)}% ต่ำกว่า %Save — ลูกค้าที่หลุดเป็นกลุ่มค่าบริการสูง`);
        if(rv!=null&&rv>ps+1.5) good.push(`%Rev Save ${rv.toFixed(1)}% สูงกว่า %Save — รักษาลูกค้าค่าบริการสูงได้ดี`); }
      const lost=rows.filter(x=>x.r).sort((a,b)=>b.r.cancel-a.r.cancel).slice(0,3).map(x=>`${x.name} ${x.r.cancel}`); if(lost.length) note=`<div class="note">สาขาที่มีจำนวนยกเลิกมากที่สุด: ${lost.join(' · ')}</div>`;
    } else { const k=SKEY[i-3]; if(!SV) return lists([],[]);
      const rows=D.shops.map(s=>{const r=(SV.shops[s.shop]||{})[k]; return {name:s.name.replace('True Shop ',''), v:r&&r.den?r.num/r.den*100:null, r};});
      const r=shopRank(rows,SV.pass[k]+3,SV.pass[k],x=>`${x.v.toFixed(1)}% (ฐาน ${Math.round(x.r.den)})`); good.push(...r.good); bad.push(...r.bad);
      const v=svcPct(state.branch,k), b=SV.bench[k], pu=b&&b.UPC.den?b.UPC.num/b.UPC.den*100:null;
      if(v!=null&&pu!=null) (v>=pu?good:bad).unshift(`${k} ${v.toFixed(1)}% ${v>=pu?'สูงกว่า':'ต่ำกว่า'}ค่าเฉลี่ย UPC ${pu.toFixed(1)}% (เกณฑ์ ${SV.pass[k]}%)`);
      const miss=rows.filter(x=>x.v==null).length; if(miss&&state.branch==='ALL') note=`<div class="note">${miss} สาขาไม่มีข้อมูล ${k}${k==='Service Level'?' (ไม่มีระบบคิว)':''}</div>`;
    }
    return lists(good.slice(0,8), bad.slice(0,9)) + note;
  });
}

    return lists(good.slice(0,8), bad.slice(0,9));
  });
}

    tbl+=`<details ${d==='เบอร์มงคล'?'open':''} style="margin-top:8px"><summary style="cursor:pointer;font-weight:600">${dimLbl[d]||d}</summary><table style="margin-top:6px"><thead><tr><th>${dimLbl[d]||d}</th><th>จำนวน</th><th>Net ฿</th><th>สัดส่วน</th><th>ทีม Upper North</th></tr></thead><tbody>
      ${rows.map(([val,x])=>{const u=ref&&ref.dims[d]&&ref.dims[d][val]; const su=u&&refT?u[0]/refT*100:null; const so=x[0]/tot*100; return `<tr><td style="text-align:left"><b>${val}</b></td><td>${fmtN(x[0])}</td><td>${fmtN(x[1])}</td><td>${so.toFixed(0)}%</td><td>${su==null?'–':su.toFixed(0)+'%'}</td></tr>`;}).join('')}</tbody></table></details>`;
  });
  return `<h4 style="margin:16px 0 4px">${p} <span style="font-weight:400;color:var(--muted);font-size:12px">· ${fmtN(tot)} รายการ · ${fK(n.dims.ALL.ALL[1])} ฿ (All Product ถึง ${AP_ASOF[p]||'-'})</span></h4>${lists(good.slice(0,7), bad.slice(0,7))}${tbl}`;
}
function showStaff(id, p){
  const e=C.staff[id]; if(!e) return; const prods = p&&p!=='ALL' ? [p] : D.products;
  const el=document.createElement('div'); el.className='hint-bg';
  el.innerHTML=`<div class="hint" role="dialog" style="max-width:980px"><button class="x" aria-label="ปิด">×</button><h3>${e.name}</h3><div class="sub">${e.role} · ${nameOf(e.shop)} · ${CUR} · เทียบกับทีม Upper North</div>
    ${p&&p!=='ALL'?`<div style="margin-top:6px"><button onclick="this.closest('.hint-bg').remove();showStaff('${id}','ALL')" style="font:inherit;font-size:12px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 10px;cursor:pointer">ดูทุกสินค้า</button></div>`:''}
    ${prods.map(x=>staffSection(id,x)).join('')}
    <div class="how">% เทียบ Indy Target ใช้ยอดเดียวกับหน้า Staff Productivity · รายละเอียดแยกประเภท / สินค้า / เบอร์มงคล มาจาก All Product Rawdata ตาม SALE_ID (ไม่นับ Suspend / Terminate) · "ทีม" = สัดส่วนของทั้ง Upper North</div></div>`;
  const close=()=>el.remove(); el.onclick=ev=>{ if(ev.target===el||ev.target.classList.contains('x')) close(); };
  document.addEventListener('keydown',function k(ev){ if(ev.key==='Escape'){close();document.removeEventListener('keydown',k);} });
  document.body.appendChild(el);
}
/* estimated staff brand target = shop brand target x (staff Indy target / shop staff Indy target total); Net share, QTY share if Net target is 0 */
function empShare(prod,id){ const e=C.staff[id]; if(!e) return null;
  const tot=k=>Object.values(C.staff).filter(x=>x.shop===e.shop).reduce((s,x)=>s+((x.p[prod]||{})[k]||0),0);
  const r=e.p[prod]||{}; const tn=tot('tn'), tq=tot('tq');
  return tn>0 ? (r.tn||0)/tn : tq>0 ? (r.tq||0)/tq : null; }
function empAxis(prod,id,ax,mode){ // {a, t (to date), v}
  const X=MX[prod], M=X&&X.months[D.cur], e=C.staff[id], k_=mode==='q'?0:1; if(!M||!e) return null;
  const n=empNode(prod,id); let a=0; if(n&&n.dims.BRAND) Object.entries(n.dims.BRAND).forEach(([b,x])=>{ if((X.axes.includes(b)?b:'อื่นๆ')===ax) a+=x[k_]; });
  const sh=empShare(prod,id), st=M.shops[e.shop]&&M.shops[e.shop][ax]; const t = sh!=null&&st ? st[k_+2]*sh*M.frac : 0;
  return {a, t, v: t? a/t*100 : null}; }
function mixStaffTable(pid){
  const prod=MIXP[pid], X=MX[prod], mode=state.mode, k_=mode==='q'?0:1, list=shopsOf(state.branch);
  const ids=Object.keys(C.staff).filter(id=>list.includes(C.staff[id].shop));
  const rows=ids.map(id=>{ const e=C.staff[id], by={}; X.axes.forEach(a=>by[a]=empAxis(prod,id,a,mode)||{a:0,t:0,v:null});
    const tot=Object.values(by).reduce((s,x)=>s+x.a,0), r=e.p[prod], t=(r['t'+mode]||0)*frs(C,prod), a=r['a'+mode]||0;
    return {id,e,by,tot,v:t?a/t*100:null}; }).filter(x=>x.tot>0||x.v!=null).sort((x,y)=>y.tot-x.tot);
  return `<div class="card" style="margin-top:16px"><h3>Staff Ranking · ${prod}</h3><div class="sub">เรียงจากยอดรวมสูงสุด · ${mode==='q'?'จำนวนชิ้น':'Net ฿'} รายแบรนด์ จาก All Product Rawdata (ถึง ${AP_ASOF[prod]||'-'}) · % Indy = ยอด ${prod} ทั้งหมด ÷ Indy Target ถึงวันนี้</div>
  <div class="scroll"><table class="hm"><thead><tr><th>#</th><th>พนักงาน</th><th style="text-align:center">รวม</th><th style="text-align:center">% Indy</th>${X.axes.map(a=>`<th style="text-align:center">${a}</th>`).join('')}</tr></thead><tbody>
  ${rows.map((r,i)=>`<tr><td>${i+1}</td><td style="text-align:left">${r.e.name}${moreBtn(r.id,prod)}<div style="font-size:11px;color:var(--muted)">${nameOf(r.e.shop)}</div></td><td class="c"><b>${fmtN(r.tot)}</b></td><td class="c"><span class="pill p-${cls(r.v)}">${fmtP(r.v)}</span></td>${X.axes.map(a=>{const z=r.by[a]; return `<td class="c" style="${hmColor(z.v)}" title="ยอด ${fmtN(z.a)} / Target ประมาณ ${fmtN(z.t)}">${z.v==null?'–':z.v.toFixed(0)+'%'}<div style="font-size:10px;font-weight:400">${fmtN(z.a)} / ${fmtN(z.t)}</div></td>`;}).join('')}</tr>`).join('')}</tbody></table></div>
  <div class="note">ช่องแบรนด์ = % เทียบ <b>Target แบรนด์รายคน (ค่าประมาณ)</b> · ตัวเลขเล็ก = ยอดจริง / Target ประมาณ ถึงวันนี้ · Target ประมาณ = Target แบรนด์ของสาขา × สัดส่วน Indy Target ${prod} ของคนนั้นในสาขา (ใช้ Net ถ้า Indy Target Net เป็น 0 ใช้ QTY) · แสดงเฉพาะพนักงานที่มี Indy Target</div></div>`;
}
function pendingView(id){ const p=PILLARS.find(x=>x.id===id); return `<div class="card pending"><h2>${p.name}</h2><p>รอข้อมูล${p.items.length?': '+p.items.join(' · '):''}</p></div>`; }

/* ---------- router ---------- */
function render(){
  const id=(location.hash||'#summary').slice(1);
  document.getElementById('nav').innerHTML=[{id:'summary',name:'Summary'}].concat(PILLARS).map(p=>`<a href="#${p.id}" class="${p.id===id?'on':''}">${p.name}</a>`).join('');
  const P_=PILLARS.find(p=>p.id===id);
  document.getElementById('app').innerHTML = !P_?summary(): P_.pending?pendingView(id): id==='sale'?detailSale(): id==='ebit'?detailEbit(): id==='service'?detailService(): id==='longevity'?detailLongevity(): MIXP[id]?detailMix(id):detailStaff();
}
function go(id){location.hash=id;}
function pick(b){state.branch=b;document.getElementById('branch').value=b;render();}
function setMode(m){state.mode=m;render();}
document.getElementById('period').textContent=`${CUR} · ${D.shops.length} สาขา · อัปเดต __BUILT__`;
const sel=document.getElementById('branch');
sel.innerHTML='<option value="ALL">ทั้งหมด (Upper North)</option>'+D.shops.map(s=>`<option value="${s.shop}">${s.name.replace('True Shop ','')}</option>`).join('');
sel.onchange=e=>{state.branch=e.target.value;render();};
window.addEventListener('hashchange',()=>{render();scrollTo(0,0);});
render();
</script>
