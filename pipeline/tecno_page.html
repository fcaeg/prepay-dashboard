<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1a18" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tecno">
<meta name="format-detection" content="telephone=no">
<title>Tecno Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --font: "IBM Plex Sans Thai", system-ui, -apple-system, "Segoe UI", sans-serif;
  --bg: #f6f5f1; --panel: #ffffff; --fg: #1f1e1c; --muted: #6b6862; --line: #e3e0d8; --soft: #f1efe9;
  --acc: #1f5fbf; --acc-soft: #e5edf9; --good: #1d7a4a; --bad: #b4382c; --bad-soft: #f8e6e3; --bar: #3b78d4; --bar2: #c9d8f0;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1b1a18; --panel: #252421; --fg: #eeece6; --muted: #a5a29a; --line: #393733; --soft: #2d2b28;
  --acc: #7fa9ec; --acc-soft: #22324a; --good: #5cc28d; --bad: #ec7f73; --bad-soft: #3a2421; --bar: #6b9be2; --bar2: #33445e;
} }
:root[data-theme="dark"] {
  --bg: #1b1a18; --panel: #252421; --fg: #eeece6; --muted: #a5a29a; --line: #393733; --soft: #2d2b28;
  --acc: #7fa9ec; --acc-soft: #22324a; --good: #5cc28d; --bad: #ec7f73; --bad-soft: #3a2421; --bar: #6b9be2; --bar2: #33445e;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 var(--font); }
.wrap { max-width: 1240px; margin: 0 auto; padding: 16px 16px 48px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; margin-bottom: 10px; }
h1 { font-size: 22px; margin: 0; font-weight: 600; letter-spacing: -.01em; }
.asof { color: var(--muted); font-size: 12.5px; }
.filters { position: sticky; top: 0; z-index: 20; background: var(--bg); padding: 8px 0 10px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.lbl { font-size: 12px; color: var(--muted); margin-right: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip { font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); padding: 6px 12px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
.chip small { color: var(--muted); margin-left: 4px; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.chip[aria-pressed="true"] small { color: inherit; opacity: .75; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel); }
.seg button { font: inherit; font-size: 13px; border: 0; background: none; color: var(--fg); padding: 6px 11px; cursor: pointer; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--acc-soft); color: var(--acc); font-weight: 600; }
select, input[type=search], input[type=date] { font: inherit; font-size: 13px; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 5px 8px; max-width: 15rem; }
.btn { font: inherit; font-size: 12.5px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 7px; padding: 5px 10px; cursor: pointer; white-space: nowrap; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.kpi .t { font-size: 12px; color: var(--muted); }
.kpi .v { font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.25; }
.kpi .s { font-size: 12px; color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 520px), 1fr)); gap: 14px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; min-width: 0; }
.card h2 { font-size: 15px; margin: 0 0 2px; font-weight: 600; }
.card .sub { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
.card .hd { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; flex-wrap: wrap; }
.full { grid-column: 1 / -1; }
.tw { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
th { font-weight: 500; color: var(--muted); font-size: 12px; cursor: pointer; user-select: none; position: sticky; top: 0; background: var(--panel); }
th:first-child, td:first-child, th.l, td.l { text-align: left; }
td.l { white-space: normal; min-width: 9rem; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--soft); }
tr.sel td { background: var(--acc-soft); }
tfoot td { font-weight: 600; border-top: 1px solid var(--fg); border-bottom: 0; }
.muted { color: var(--muted); }
.neg { color: var(--bad); } .pos { color: var(--good); }
.cv-low { color: var(--bad); font-weight: 600; } .cv-hi { color: var(--muted); }
.fam .stk { font-size: 12.5px; color: var(--muted); margin: -2px 0 8px; } .fam .stk b { color: var(--fg); font-weight: 600; }
.tag { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--bad-soft); color: var(--bad); }
.bars { display: flex; flex-direction: column; gap: 6px; }
.bar { display: grid; grid-template-columns: minmax(7rem, 11rem) 1fr 4.5rem; gap: 8px; align-items: center; font-size: 13px; }
.bar .tr { height: 14px; background: var(--soft); border-radius: 4px; overflow: hidden; }
.bar .fl { height: 100%; background: var(--bar); border-radius: 4px; }
.bar .n { text-align: right; font-variant-numeric: tabular-nums; }
svg text { fill: var(--muted); font: 11px var(--font); }
.fams { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 12px; margin-bottom: 14px; }
.chips[hidden], .seg[hidden] { display: none; }
.chips .lbl { align-self: center; min-width: 3.2rem; }
.fam { display: flex; flex-direction: column; justify-content: flex-start; text-align: left; font: inherit; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; cursor: pointer; }
.fam:hover { border-color: var(--muted); }
.fam[aria-pressed="true"] { border-color: var(--acc); box-shadow: 0 0 0 1px var(--acc) inset; }
.fam .nm { font-size: 16px; font-weight: 600; }
.fam .nm small { font-weight: 400; color: var(--muted); font-size: 12px; margin-left: 6px; }
.fam .big { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 6px 0 8px; font-variant-numeric: tabular-nums; }
.fam .big div { display: flex; flex-direction: column; }
.fam .big b { font-size: 22px; font-weight: 600; line-height: 1.2; }
.fam .big span { font-size: 11.5px; color: var(--muted); }
.fam .share { height: 6px; background: var(--soft); border-radius: 3px; overflow: hidden; margin-bottom: 8px; }
.fam .share i { display: block; height: 100%; background: var(--bar); }
.fam .caps { font-size: 12.5px; color: var(--muted); display: grid; grid-template-columns: 1fr auto auto; gap: 2px 12px; font-variant-numeric: tabular-nums; }
.fam .caps b { color: var(--fg); font-weight: 500; }
strong.ach { font-weight: inherit; font-size: inherit; }
.empty { color: var(--muted); padding: 24px 0; text-align: center; }
.scroll { max-height: 520px; overflow: auto; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); -webkit-tap-highlight-color: transparent; }
.fg { display: flex; align-items: center; gap: 6px; }
.tw { -webkit-overflow-scrolling: touch; }
.sm { display: none; }
button, select, input { touch-action: manipulation; }
/* tablet (iPad portrait / landscape) */
@media (max-width: 1100px) {
  .grid { grid-template-columns: 1fr; }
  .kpis { grid-template-columns: repeat(3, 1fr); }
}
/* phone (iOS / Android) */
@media (max-width: 640px) {
  .wrap { padding: 12px 12px 40px; }
  h1 { font-size: 20px; }
  .filters { position: static; padding-top: 4px; }
  .frow { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .fdate, .fper { grid-column: 1 / -1; }
  .fdate input { flex: 1; min-width: 0; }
  .fdate .lbl { display: none; }
  .fper { display: flex; }
  .fper button { flex: 1; padding: 8px 2px; }
  .fsel .lbl { display: none; }
  .ftm { grid-column: 1 / -1; }
  .ftm .seg { flex: 1; } .ftm .seg button { flex: 1; }
  .fsel select { width: 100%; max-width: none; }
  select, input[type=search], input[type=date] { font-size: 16px; padding: 7px 8px; } /* 16px: iOS does not zoom in */
  .chips { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-left: -12px; margin-right: -12px; padding: 0 12px 2px; }
  .chips::-webkit-scrollbar { display: none; }
  .chips .lbl { min-width: auto; }
  .chip { padding: 8px 14px; }
  .kpis { grid-template-columns: 1fr 1fr; gap: 8px; }
  .kpi { padding: 10px 12px; }
  .kpi .v { font-size: 20px; }
  .fam { padding: 12px 14px; }
  .fam .big { display: grid; grid-template-columns: repeat(4, auto); justify-content: space-between; gap: 4px 10px; }
  .fam .big b { font-size: 18px; }
  .fam .nm small { display: block; margin: 2px 0 0; }
  .card { padding: 12px; border-radius: 10px; }
  .card .hd .row { width: 100%; }
  .card .hd .row input[type=search] { flex: 1; min-width: 0; }
  th, td { padding: 7px 5px; }
  table { font-size: 12.5px; }
  .hs { display: none; }
  .sm { display: block; font-size: 11.5px; }
  .bar { grid-template-columns: 6.5rem 1fr 3rem; }
  .scroll { max-height: 75vh; }
}
/* small Android phones (360 px and less) */
.xs { display: none; }
@media (max-width: 400px) {
  .hx { display: none; }
  .xs { display: inline; }
  td.l { min-width: 0; }
  .kpi .v { font-size: 18px; }
  .fam .big b { font-size: 16px; }
  .fper button { font-size: 12.5px; }
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Tecno Dashboard</h1>
  <span class="asof" id="asof"></span>
</header>

<div class="filters">
  <div class="row frow">
    <div class="fg fdate"><span class="lbl">วันที่</span><input type="date" id="d1" aria-label="ตั้งแต่วันที่"><span class="muted">ถึง</span><input type="date" id="d2" aria-label="ถึงวันที่"></div>
    <div class="seg fper" id="per">
      <button data-p="today">วันนี้</button><button data-p="yday">เมื่อวาน</button><button data-p="d7">7 วัน</button><button data-p="mtd">เดือนนี้</button><button data-p="all">ทั้งหมด</button>
    </div>
    <div class="fg fsel"><span class="lbl">พื้นที่</span><select id="area" aria-label="พื้นที่"><option value="">ทุกพื้นที่</option></select></div>
    <div class="fg fsel"><span class="lbl">ประเภทสาขา</span><select id="stype" aria-label="ประเภทสาขา"><option value="">ทุกประเภท</option></select></div>
    <span id="tmw" class="fg ftm"><span class="lbl">Target</span><div class="seg" id="tm"><button data-t="q">QTY</button><button data-t="n">Net Amount</button></div></span>
  </div>
  <div class="chips" id="models" role="group" aria-label="เลือกรุ่น"></div>
  <div class="chips" id="caps" role="group" aria-label="เลือกความจุ"></div>
</div>

<div class="kpis" id="kpis"></div>

<section class="fams" id="fams" aria-label="สรุปรายรุ่น"></section>

<div class="grid">
  <section class="card full">
    <div class="hd"><div><h2>ราย Area</h2><div class="sub">เครื่องที่ขาย · ยอดขาย · จำนวนสาขาที่ขายได้</div></div><button class="btn" id="area-png">ดาวน์โหลด PNG</button></div>
    <div class="tw" id="tb-area"></div>
  </section>
  <section class="card full">
    <div class="hd">
      <div><h2>รายสาขา</h2><div class="sub">สาขาที่มียอดขายในช่วงวันที่ที่เลือก</div></div>
      <div class="row"><input type="search" id="q" placeholder="ค้นหาสาขา / รหัส"><button class="btn" id="csv">Export CSV</button></div>
    </div>
    <div class="tw scroll" id="tb-shop"></div>
  </section>
  <section class="card full">
    <div class="hd">
      <div><h2>Stock คงเหลือ</h2><div class="sub" id="stk-sub"></div></div>
      <div class="row"><div class="seg" id="stkv"><button data-v="area">ราย Area</button><button data-v="shop">รายสาขา</button><button data-v="col">รุ่น · สี</button></div><button class="btn" id="stk-csv">Export CSV</button></div>
    </div>
    <div class="tw scroll" id="tb-stock"></div>
  </section>
  <section class="card">
    <div class="hd"><div><h2 id="mt-h">สรุปรายรุ่น</h2><div class="sub" id="mt-sub"></div></div></div>
    <div class="tw" id="tb-model"></div>
  </section>
  <section class="card">
    <div class="hd"><div><h2>สีที่ขาย</h2><div class="sub" id="col-sub"></div></div></div>
    <div id="colours"></div>
  </section>
  <section class="card full">
    <div class="hd"><div><h2>ยอดขายรายวัน</h2><div class="sub" id="trend-sub">เครื่อง / วัน</div></div></div>
    <div id="trend"></div>
  </section>
  <section class="card full">
    <div class="hd"><div><h2>ช่วงเวลาที่ขาย</h2><div class="sub">เครื่องที่ขาย แยกตามชั่วโมงของบิล</div></div></div>
    <div id="hours"></div>
  </section>
</div>
</div>

<script>
const D = __DATA__;
const $ = (s) => document.querySelector(s);
const TH = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
const fmt = (n) => Math.round(n || 0).toLocaleString('en-US');
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const dTH = (d) => { if (!d) return '-'; const [y, m, dd] = d.slice(0, 10).split('-'); return `${+dd} ${TH[+m - 1]}`; };
const dtTH = (s) => s ? `${dTH(s)} ${+s.slice(0, 4) + 543 - 2500} ${s.slice(11, 16)} น.` : '-';
const shop = Object.fromEntries(D.shops.map((x) => [x.c, x]));
const mname = Object.fromEntries(D.models.map((x) => [x.k, x.name]));
const short = (k) => (mname[k] || k).replace(/^TECNO /, '');
const last = D.meta.sales_asof.slice(0, 10) || (D.sales.length ? D.sales[D.sales.length - 1][0] : '');
const addDays = (d, n) => { const t = new Date(d + 'T00:00:00Z'); t.setUTCDate(t.getUTCDate() + n); return t.toISOString().slice(0, 10); };
const famOf = Object.fromEntries(D.models.map((x) => [x.k, x.fam]));
const capOf = (k) => k.split('|').slice(1).filter(Boolean).join(' ').replace(/(\d+\/\d+)$/, '$1GB');
const FORDER = ['POP20', 'CAMON'];  // POP 20 first, then Camon, then other models
const frank = (f) => { const i = FORDER.findIndex((p) => f.startsWith(p)); return i < 0 ? 9 : i; };
const FAMS = [...new Set(D.models.map((x) => x.fam))].sort((a, b) => frank(a) - frank(b) || a.localeCompare(b));
const first = D.meta.first_sales || last;
const hasNet = Object.values(D.targets || {}).some((rs) => rs.some((r) => r[3] > 0));  // net-amount target in the file?
const S = { tm: 'q', p: 'mtd', fam: FAMS[0] || '', model: '', area: '', type: '', q: '', sort: {}, sv: 'area' };
try { const sv = JSON.parse(localStorage.getItem('tecno') || '{}'); if (sv.p) S.p = sv.p; if (sv.tm === 'n' && hasNet) S.tm = 'n'; } catch (e) {}
function preset(p) {
  S.p = p;
  if (p === 'today') S.d1 = S.d2 = last;
  else if (p === 'yday') S.d1 = S.d2 = addDays(last, -1);
  else if (p === 'd7') { S.d1 = addDays(last, -6); S.d2 = last; }
  else if (p === 'mtd') { S.d1 = last.slice(0, 8) + '01'; S.d2 = last; }
  else { S.p = 'all'; S.d1 = first; S.d2 = last; }
}
preset(S.p);
const mOk = (k) => (!S.fam || famOf[k] === S.fam) && (!S.model || k === S.model);

$('#asof').textContent = `ยอดขายถึง ${dtTH(D.meta.sales_asof)}${D.meta.stock_asof ? ` · Stock ณ ${dtTH(D.meta.stock_asof)}` : ''} · ข้อมูลจาก TSM (สาขา WW)`;
const SELL = (r) => r[3] !== 'DEMO';  // sellable stock (MAIN_STOCK + SUB_STOCK)
const CV_DAYS = 7;  // cover = stock / average units per day over the last 7 days of sales data
const cover = (s, u7) => u7 > 0 ? s / (u7 / CV_DAYS) : (s > 0 ? Infinity : 0);
const cvF = (s, u7) => { const c = cover(s, u7); if (!s) return u7 > 0 ? '<span class="tag">หมด</span>' : '-'; if (c === Infinity) return '<span class="cv-hi">ไม่มียอด</span>'; return `<span class="${c < 7 ? 'cv-low' : ''}">${c < 10 ? c.toFixed(1) : fmt(c)} วัน</span>`; };
const areas = D.areas || [...new Set(D.shops.map((x) => x.area).filter(Boolean))].sort();
$('#area').innerHTML += areas.map((a) => `<option>${esc(a)}</option>`).join('');
const types = [...new Set((D.ww || []).map((x) => x[2]).concat(D.shops.map((x) => x.type)).filter(Boolean))].sort();
$('#stype').innerHTML += types.map((a) => `<option>${esc(a)}</option>`).join('');

function range() { const a = S.d1 || first, b = S.d2 || last; return a <= b ? [a, b] : [b, a]; }
// monthly targets, pro-rated to the chosen dates (days of the month inside the range / days in the month)
function tgt(a, b) {
  const out = [];
  Object.entries(D.targets || {}).forEach(([mo, rs]) => {
    const m0 = mo + '-01', dim = new Date(Date.UTC(+mo.slice(0, 4), +mo.slice(5, 7), 0)).getUTCDate(), m1 = mo + '-' + String(dim).padStart(2, '0');
    const x0 = a > m0 ? a : m0, x1 = b < m1 ? b : m1; if (x0 > x1) return;
    const f = ((Date.parse(x1) - Date.parse(x0)) / 864e5 + 1) / dim;
    rs.forEach((r) => out.push([r[0], r[1], r[2] * f, r[3] * f]));
  });
  return out;
}
const pct = (u, t) => t > 0 ? `<strong class="ach ${u >= t ? 'pos' : ''}">${Math.round(100 * u / t)}%</strong>` : '-';
const sumT = (rs, i) => rs.reduce((s, r) => s + r[i], 0);
// Target mode: QTY (default) or Net amount. Column order everywhere: Target > ยอด > %ACH > ยอดขายสะสม
const isN = () => S.tm === 'n';
const tI = () => (isN() ? 3 : 2);                       // index of the target in tgt() rows
const A = (x) => (isN() ? x.n : x.u);                    // actual measured against the target
const B = (x) => (isN() ? x.u : x.n);                    // the other measure, shown as ยอดขายสะสม
const LBL = () => isN()
  ? { t: 'Target Net (฿)', a: 'ยอด Net (฿)', b: 'ยอดขายสะสม (เครื่อง)' }
  : { t: 'Target (เครื่อง)', a: 'ยอด QTY', b: 'ยอดขายสะสม (฿)' };
const tcols = () => { const L = LBL(); return [
  { h: L.t, hs: 1, v: (x) => x.t || 0, f: (x) => x.t ? fmt(x.t) : '-' },
  { h: L.a, v: A, def: 1 },
  { h: '%ACH', v: (x) => x.t ? A(x) / x.t : 0, f: (x) => pct(A(x), x.t) },
  { h: L.b, hx: 1, v: B },
]; };
const tfoot = (T) => [fmt(T((x) => x.t || 0)), fmt(T(A)), pct(T(A), T((x) => x.t || 0)), fmt(T(B))];
const shopOk = (c) => { const x = shop[c] || {}; return (!S.area || x.area === S.area) && (!S.type || x.type === S.type); };

function draw() {
  try { localStorage.setItem('tecno', JSON.stringify({ p: S.p === 'custom' ? 'mtd' : S.p, tm: S.tm })); } catch (e) {}
  $('#tmw').style.display = hasNet ? '' : 'none';

function trend(rows, a, b) {
  const by = {}; rows.forEach((r) => (by[r[0]] = (by[r[0]] || 0) + r[4]));
  let d0 = a, d1 = b;
  if (d1 < addDays(d0, 13)) { d0 = addDays(d1, -13) < first ? first : addDays(d1, -13); }
  const ds = []; for (let d = d0; d <= d1 && ds.length < 400; d = addDays(d, 1)) ds.push(d);
  if (!ds.length) { $('#trend').innerHTML = '<div class="empty">ยังไม่มียอดขาย</div>'; return; }
  const cw = $('#trend').clientWidth || 900, W = Math.max(ds.length * (cw < 500 ? 12 : 26), cw), H = cw < 500 ? 150 : 180, pb = 22, pt = 16, mx = Math.max(1, ...ds.map((d) => by[d] || 0));
  const lab = Math.ceil(ds.length / Math.max(1, Math.floor(W / 30)));
  const bw = W / ds.length;
  const bars = ds.map((d, i) => {
    const v = by[d] || 0, h = (H - pb - pt) * v / mx, x = i * bw + bw * .15, y = H - pb - h;
    const on = d >= a && d <= b;
    return `<rect x="${x}" y="${y}" width="${bw * .7}" height="${h}" rx="3" fill="var(${on ? '--bar' : '--bar2'})"><title>${dTH(d)}: ${v} เครื่อง</title></rect>` +
      (v && bw >= 16 ? `<text x="${x + bw * .35}" y="${y - 3}" text-anchor="middle">${v}</text>` : '') +
      (i % lab === 0 ? `<text x="${x + bw * .35}" y="${H - 6}" text-anchor="middle">${+d.slice(8)}</text>` : '');
  }).join('');
  $('#trend').innerHTML = `<div class="tw"><svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="display:block;max-width:none">${bars}</svg></div>`;
  $('#trend-sub').textContent = `เครื่อง / วัน · ${dTH(ds[0])} – ${dTH(ds[ds.length - 1])}` + ' · ' + selName();
}

function table(el, cols, data, key, foot, rowAttr) {

  const i = st.i < 0 ? 1 : st.i;

    data.map((r) => `<tr ${rowAttr ? rowAttr(r) : ''}>${cols.map((c) => `<td class="${c.l ? 'l' : ''} ${c.hs ? 'hs' : ''} ${c.hx ? 'hx' : ''}">${c.f ? c.f(r) : fmt(c.v(r))}</td>`).join('')}</tr>`).join('') +

  el.querySelectorAll('th').forEach((th) => th.onclick = () => { const j = +th.dataset.i; S.sort[key] = { i: j, dir: j === i ? -st.dir : (cols[j].l ? 1 : -1) }; draw(); });

  const tot = ['รวม' + (v === 'shop' ? ` ${fmt(stkRows.length)} สาขา` : ''), ...(v === 'shop' ? [''] : []), fmt(T((x) => x.s)), fmt(T((x) => x.u7)), cvF(T((x) => x.s), T((x) => x.u7)), fmt(T((x) => x.dm)), ...(v === 'area' ? [fmt(T((x) => x.sh.size))] : [])];

  $('#stk-sub').textContent = `${selName()} · ณ ${dtTH(D.meta.stock_asof)} · Cover = Stock ÷ ยอดขายเฉลี่ย/วัน ${CV_DAYS} วันล่าสุด (${dTH(addDays(last, -(CV_DAYS - 1)))} – ${dTH(last)}) · ต่ำกว่า 7 วันเป็นสีแดง · ไม่นับเครื่อง Demo`;
}
$('#stkv').onclick = (e) => { const b = e.target.closest('button'); if (b) { S.sv = b.dataset.v; draw(); } };
$('#stk-csv').onclick = () => {
  const L = [[S.sv === 'area' ? 'Area' : S.sv === 'shop' ? 'Shop Code' : 'Model · Colour', ...(S.sv === 'shop' ? ['Shop', 'Area'] : []), 'Stock', 'Sold last 7 days', 'Cover days', 'Demo', 'Model', 'Stock as of']].concat(stkRows.map((x) => {
    const c = cover(x.s, x.u7); return [x.k, ...(S.sv === 'shop' ? [(shop[x.k] || {}).n || '', (shop[x.k] || {}).area || ''] : []), x.s, x.u7, c === Infinity ? '' : Math.round(c * 10) / 10, x.dm, selName(), D.meta.stock_asof];
  }));

  const el = document.createElement('a'); el.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));

// PNG of the Area table (same rows and order as on screen; always light colours so it reads well in LINE)
$('#area-png').onclick = async () => {
  if (!areaImg) return;
  try { await document.fonts.ready; } catch (e) {}
  const { data, T } = areaImg, L = LBL(), [a, b] = range();
  const cols = [
    { h: 'Area', w: 250, l: 1, v: (x) => x.k },
    { h: L.t, w: 130, v: (x) => x.t ? fmt(x.t) : '-' },
    { h: L.a, w: 110, v: (x) => fmt(A(x)) },
    { h: '%ACH', w: 150, ach: 1 },
    { h: L.b, w: 150, v: (x) => fmt(B(x)) },
    { h: 'สาขาที่ขาย', w: 110, v: (x) => `${x.sh.size}/${x.all || 0}` },
  ];
  const W = cols.reduce((s, c) => s + c.w, 0) + 48, RH = 34, top = 112, H = top + RH * (data.length + 2) + 40, sc = 2;
  const cv = document.createElement('canvas'); cv.width = W * sc; cv.height = H * sc;
  const g = cv.getContext('2d'); g.scale(sc, sc);
  const F = (w, z) => `${w} ${z}px "IBM Plex Sans Thai", system-ui, sans-serif`;
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, W, H);
  g.fillStyle = '#1f1e1c'; g.font = F(600, 22); g.textBaseline = 'alphabetic';
  g.fillText(`Tecno ${selName()} — ยอดขายราย Area`, 24, 40);
  g.fillStyle = '#6b6862'; g.font = F(400, 14);
  const flt = [S.area, S.type].filter(Boolean).join(' · ');
  g.fillText(`${a === b ? dTH(a) : dTH(a) + ' – ' + dTH(b)} ${+b.slice(0, 4) + 543}${flt ? ' · ' + flt : ''} · Target ${isN() ? 'Net Amount' : 'QTY'} (ตามสัดส่วนวัน) · ข้อมูลถึง ${dtTH(D.meta.sales_asof)}`, 24, 66);
  const tot = { k: 'รวม', t: T((x) => x.t || 0), u: T((x) => x.u), n: T((x) => x.n), all: T((x) => x.all || 0), sh: { size: T((x) => x.sh.size) } };
  const row = (x, y, head, bold) => {
    let cx = 24;
    cols.forEach((c) => {
      const txt = head ? c.h : c.ach ? (x.t ? Math.round(100 * A(x) / x.t) + '%' : '-') : c.v(x);
      g.font = F(head ? 500 : bold ? 600 : 400, head ? 13 : 14.5);
      if (c.ach && !head && x.t) {   // small bar behind %ACH
        const r = A(x) / x.t, bw = 70;
        g.fillStyle = '#eef0f3'; g.fillRect(cx + c.w - 12 - bw - 52, y - 15, bw, 10);
        g.fillStyle = r >= 1 ? '#1d7a4a' : r >= .7 ? '#3b78d4' : '#c0533f'; g.fillRect(cx + c.w - 12 - bw - 52, y - 15, bw * Math.min(1, r), 10);
      }
      g.fillStyle = head ? '#6b6862' : c.ach && x.t ? (A(x) >= x.t ? '#1d7a4a' : A(x) / x.t < .7 ? '#b4382c' : '#1f1e1c') : '#1f1e1c';
      g.textAlign = c.l ? 'left' : 'right'; g.fillText(txt, c.l ? cx + 8 : cx + c.w - 12, y);
      cx += c.w;
    });
    g.textAlign = 'left';
  };
  let y = top;
  g.fillStyle = '#f6f5f1'; g.fillRect(24, y - 24, W - 48, RH); row(null, y - 3, true); y += RH;
  data.forEach((x, i) => {
    if (i % 2) { g.fillStyle = '#fafaf8'; g.fillRect(24, y - 24, W - 48, RH); }
    g.strokeStyle = '#e3e0d8'; g.beginPath(); g.moveTo(24, y + 10); g.lineTo(W - 24, y + 10); g.stroke();
    row(x, y - 3); y += RH;
  });
  g.strokeStyle = '#1f1e1c'; g.lineWidth = 1.5; g.beginPath(); g.moveTo(24, y - 24); g.lineTo(W - 24, y - 24); g.stroke();
  row(tot, y - 3, false, true);
  g.fillStyle = '#9a968e'; g.font = F(400, 12); g.fillText('Tecno Dashboard · TSM (สาขา WW)', 24, H - 16);
  cv.toBlob((bl) => {
    const el = document.createElement('a'); el.href = URL.createObjectURL(bl);
    el.download = `tecno_area_${selName().replace(/\W+/g, '_')}_${a}_${b}.png`; document.body.appendChild(el); el.click(); el.remove();
    setTimeout(() => URL.revokeObjectURL(el.href), 4000);
  }, 'image/png');
};

$('#csv').onclick = () => {
  const [a, b] = range();
  const L = [['Shop Code', 'Shop', 'Area', 'Type', isN() ? 'Target Net' : 'Target QTY', isN() ? 'Net' : 'Units', '%ACH', isN() ? 'Units' : 'Net', 'Last sale', 'Model', 'From', 'To']].concat(shopRows.map((x) => {
    const s = shop[x.c] || {}; return [x.c, s.n || '', s.area || '', s.type || '', Math.round(x.t * 10) / 10, Math.round(A(x)), x.t ? Math.round(100 * A(x) / x.t) + '%' : '', Math.round(B(x)), x.last, selName(), a, b];
  }));
  const csv = '﻿' + L.map((r) => r.map((v) => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\r\n');

};
$('#tm').onclick = (e) => { const t = e.target.closest('button')?.dataset.t; if (t) { S.tm = t; draw(); } };
$('#per').onclick = (e) => { const p = e.target.closest('button')?.dataset.p; if (p) { preset(p); draw(); } };
$('#models').onclick = (e) => { const b = e.target.closest('button'); if (b) { S.fam = b.dataset.f; S.model = ''; draw(); } };
$('#caps').onclick = (e) => { const b = e.target.closest('button'); if (b) { S.model = b.dataset.m; draw(); } };
$('#fams').onclick = (e) => { const b = e.target.closest('.fam'); if (b) { S.fam = S.fam === b.dataset.f ? '' : b.dataset.f; S.model = ''; draw(); } };
$('#area').onchange = (e) => { S.area = e.target.value; draw(); };
$('#stype').onchange = (e) => { S.type = e.target.value; draw(); };

$('#d1').min = $('#d2').min = first; $('#d1').max = $('#d2').max = last;
$('#d1').onchange = (e) => { S.d1 = e.target.value || first; S.p = 'custom'; draw(); }; $('#d2').onchange = (e) => { S.d2 = e.target.value || last; S.p = 'custom'; draw(); };
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(draw, 200); });
draw();
</script>
