<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Tecno Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --font: "IBM Plex Sans Thai", system-ui, -apple-system, "Segoe UI", sans-serif;
  --bg: #f6f5f1; --panel: #ffffff; --fg: #1f1e1c; --muted: #6b6862; --line: #e3e0d8; --soft: #f1efe9;
  --acc: #1f5fbf; --acc-soft: #e5edf9; --good: #1d7a4a; --bad: #b4382c; --bad-soft: #f8e6e3; --bar: #3b78d4; --bar2: #c9d8f0;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1b1a18; --panel: #252421; --fg: #eeece6; --muted: #a5a29a; --line: #393733; --soft: #2d2b28;
  --acc: #7fa9ec; --acc-soft: #22324a; --good: #5cc28d; --bad: #ec7f73; --bad-soft: #3a2421; --bar: #6b9be2; --bar2: #33445e;
} }
:root[data-theme="dark"] {
  --bg: #1b1a18; --panel: #252421; --fg: #eeece6; --muted: #a5a29a; --line: #393733; --soft: #2d2b28;
  --acc: #7fa9ec; --acc-soft: #22324a; --good: #5cc28d; --bad: #ec7f73; --bad-soft: #3a2421; --bar: #6b9be2; --bar2: #33445e;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 var(--font); }
.wrap { max-width: 1240px; margin: 0 auto; padding: 16px 16px 48px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; margin-bottom: 10px; }
h1 { font-size: 22px; margin: 0; font-weight: 600; letter-spacing: -.01em; }
.asof { color: var(--muted); font-size: 12.5px; }
.filters { position: sticky; top: 0; z-index: 20; background: var(--bg); padding: 8px 0 10px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.lbl { font-size: 12px; color: var(--muted); margin-right: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip { font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); padding: 6px 12px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
.chip small { color: var(--muted); margin-left: 4px; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.chip[aria-pressed="true"] small { color: inherit; opacity: .75; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel); }
.seg button { font: inherit; font-size: 13px; border: 0; background: none; color: var(--fg); padding: 6px 11px; cursor: pointer; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--acc-soft); color: var(--acc); font-weight: 600; }
select, input[type=search], input[type=date] { font: inherit; font-size: 13px; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 5px 8px; max-width: 15rem; }
.btn { font: inherit; font-size: 12.5px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 7px; padding: 5px 10px; cursor: pointer; white-space: nowrap; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.kpi .t { font-size: 12px; color: var(--muted); }
.kpi .v { font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.25; }
.kpi .s { font-size: 12px; color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 520px), 1fr)); gap: 14px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; min-width: 0; }
.card h2 { font-size: 15px; margin: 0 0 2px; font-weight: 600; }
.card .sub { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
.card .hd { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; flex-wrap: wrap; }
.full { grid-column: 1 / -1; }
.tw { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
th { font-weight: 500; color: var(--muted); font-size: 12px; cursor: pointer; user-select: none; position: sticky; top: 0; background: var(--panel); }
th:first-child, td:first-child, th.l, td.l { text-align: left; }
td.l { white-space: normal; min-width: 9rem; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--soft); }
tr.sel td { background: var(--acc-soft); }
tfoot td { font-weight: 600; border-top: 1px solid var(--fg); border-bottom: 0; }
.muted { color: var(--muted); }
.neg { color: var(--bad); } .pos { color: var(--good); }
.tag { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--bad-soft); color: var(--bad); }
.bars { display: flex; flex-direction: column; gap: 6px; }
.bar { display: grid; grid-template-columns: minmax(7rem, 11rem) 1fr 4.5rem; gap: 8px; align-items: center; font-size: 13px; }
.bar .tr { height: 14px; background: var(--soft); border-radius: 4px; overflow: hidden; }
.bar .fl { height: 100%; background: var(--bar); border-radius: 4px; }
.bar .n { text-align: right; font-variant-numeric: tabular-nums; }
svg text { fill: var(--muted); font: 11px var(--font); }
.fams { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 12px; margin-bottom: 14px; }
.chips[hidden] { display: none; }
.chips .lbl { align-self: center; min-width: 3.2rem; }
.fam { display: flex; flex-direction: column; justify-content: flex-start; text-align: left; font: inherit; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; cursor: pointer; }
.fam:hover { border-color: var(--muted); }
.fam[aria-pressed="true"] { border-color: var(--acc); box-shadow: 0 0 0 1px var(--acc) inset; }
.fam .nm { font-size: 16px; font-weight: 600; }
.fam .nm small { font-weight: 400; color: var(--muted); font-size: 12px; margin-left: 6px; }
.fam .big { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 6px 0 8px; font-variant-numeric: tabular-nums; }
.fam .big div { display: flex; flex-direction: column; }
.fam .big b { font-size: 22px; font-weight: 600; line-height: 1.2; }
.fam .big span { font-size: 11.5px; color: var(--muted); }
.fam .share { height: 6px; background: var(--soft); border-radius: 3px; overflow: hidden; margin-bottom: 8px; }
.fam .share i { display: block; height: 100%; background: var(--bar); }
.fam .caps { font-size: 12.5px; color: var(--muted); display: grid; grid-template-columns: 1fr auto auto; gap: 2px 12px; font-variant-numeric: tabular-nums; }
.fam .caps b { color: var(--fg); font-weight: 500; }
strong.ach { font-weight: inherit; font-size: inherit; }
.empty { color: var(--muted); padding: 24px 0; text-align: center; }
.scroll { max-height: 520px; overflow: auto; }
@media (max-width: 640px) { .kpi .v { font-size: 20px; } .bar { grid-template-columns: 7rem 1fr 3.5rem; } }
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Tecno Dashboard</h1>
  <span class="asof" id="asof"></span>
</header>

<div class="filters">
  <div class="row">
    <span class="lbl">วันที่</span>
    <input type="date" id="d1" aria-label="ตั้งแต่วันที่"> <span class="muted">ถึง</span> <input type="date" id="d2" aria-label="ถึงวันที่">
    <div class="seg" id="per">
      <button data-p="today">วันนี้</button><button data-p="yday">เมื่อวาน</button><button data-p="d7">7 วัน</button><button data-p="mtd">เดือนนี้</button><button data-p="all">ทั้งหมด</button>
    </div>
    <span class="lbl" style="margin-left:6px">พื้นที่</span>
    <select id="area"><option value="">ทุกพื้นที่</option></select>
    <span class="lbl" style="margin-left:6px">ประเภทสาขา</span>
    <select id="stype"><option value="">ทุกประเภท</option></select>
  </div>
  <div class="chips" id="models" role="group" aria-label="เลือกรุ่น"></div>
  <div class="chips" id="caps" role="group" aria-label="เลือกความจุ"></div>
</div>

<div class="kpis" id="kpis"></div>

<section class="fams" id="fams" aria-label="สรุปรายรุ่น"></section>

<div class="grid">
  <section class="card full">
    <div class="hd"><div><h2>ราย Area</h2><div class="sub">เครื่องที่ขาย · ยอดขาย · จำนวนสาขาที่ขายได้</div></div></div>
    <div class="tw" id="tb-area"></div>
  </section>
  <section class="card full">
    <div class="hd">
      <div><h2>รายสาขา</h2><div class="sub">สาขาที่มียอดขายในช่วงวันที่ที่เลือก</div></div>
      <div class="row"><input type="search" id="q" placeholder="ค้นหาสาขา / รหัส"><button class="btn" id="csv">Export CSV</button></div>
    </div>
    <div class="tw scroll" id="tb-shop"></div>
  </section>
  <section class="card">
    <div class="hd"><div><h2 id="mt-h">สรุปรายรุ่น</h2><div class="sub" id="mt-sub"></div></div></div>
    <div class="tw" id="tb-model"></div>
  </section>
  <section class="card">
    <div class="hd"><div><h2>สีที่ขาย</h2><div class="sub" id="col-sub"></div></div></div>
    <div id="colours"></div>
  </section>
  <section class="card full">
    <div class="hd"><div><h2>ยอดขายรายวัน</h2><div class="sub" id="trend-sub">เครื่อง / วัน</div></div></div>
    <div id="trend"></div>
  </section>
  <section class="card full">
    <div class="hd"><div><h2>ช่วงเวลาที่ขาย</h2><div class="sub">เครื่องที่ขาย แยกตามชั่วโมงของบิล</div></div></div>
    <div id="hours"></div>
  </section>
</div>
</div>

$('#asof').textContent = `ยอดขายถึง ${dtTH(D.meta.sales_asof)} · ข้อมูลจาก TSM (สาขา WW)`;

function range() { const a = S.d1 || first, b = S.d2 || last; return a <= b ? [a, b] : [b, a]; }
// monthly targets, pro-rated to the chosen dates (days of the month inside the range / days in the month)
function tgt(a, b) {
  const out = [];
  Object.entries(D.targets || {}).forEach(([mo, rs]) => {
    const m0 = mo + '-01', dim = new Date(Date.UTC(+mo.slice(0, 4), +mo.slice(5, 7), 0)).getUTCDate(), m1 = mo + '-' + String(dim).padStart(2, '0');
    const x0 = a > m0 ? a : m0, x1 = b < m1 ? b : m1; if (x0 > x1) return;
    const f = ((Date.parse(x1) - Date.parse(x0)) / 864e5 + 1) / dim;
    rs.forEach((r) => out.push([r[0], r[1], r[2] * f, r[3] * f]));
  });
  return out;
}
const pct = (u, t) => t > 0 ? `<strong class="ach ${u >= t ? 'pos' : ''}">${Math.round(100 * u / t)}%</strong>` : '-';
const sumT = (rs, i) => rs.reduce((s, r) => s + r[i], 0);
const shopOk = (c) => { const x = shop[c] || {}; return (!S.area || x.area === S.area) && (!S.type || x.type === S.type); };

function draw() {

  document.querySelectorAll('#per button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.p === S.p));
  $('#d1').value = S.d1; $('#d2').value = S.d2;
  const [a, b] = range();
  const inR = (d) => d >= a && d <= b;
  const all = D.sales.filter((r) => shopOk(r[1]));                // every model, current shop filter
  const rows = all.filter((r) => inR(r[0]));                        // + period
  const sel = rows.filter((r) => mOk(r[2]));                      // + model / capacity
  const stk = [];
  const stkSel = stk.filter((r) => mOk(r[1]));
  // model (family) chips, then capacity chips of the chosen model
  const fu = {}; rows.forEach((r) => (fu[famOf[r[2]]] = (fu[famOf[r[2]]] || 0) + r[4]));
  $('#models').innerHTML = `<span class="lbl">รุ่น</span>` +
    FAMS.map((f) => `<button class="chip" data-f="${esc(f)}" aria-pressed="${S.fam === f}">${esc(f)}</button>`).join('') +
    `<button class="chip" data-f="" aria-pressed="${!S.fam}">ทุกรุ่น</button>`;
  const ks = D.models.filter((m) => m.fam === S.fam);
  const mu = {}; rows.forEach((r) => (mu[r[2]] = (mu[r[2]] || 0) + r[4]));
  $('#caps').hidden = !S.fam || ks.length < 2;
  $('#caps').innerHTML = `<span class="lbl">ความจุ</span><button class="chip" data-m="" aria-pressed="${!S.model}">ทุกความจุ</button>` +
    ks.map((m) => `<button class="chip" data-m="${esc(m.k)}" aria-pressed="${S.model === m.k}">${esc(capOf(m.k))}</button>`).join('');
  const T0 = tgt(a, b).filter((r) => shopOk(r[0])), Tsel = T0.filter((r) => mOk(r[1]));
  famCards(rows, stk, T0);
  // KPIs
  const u = sel.reduce((s, r) => s + r[4], 0), n = sel.reduce((s, r) => s + r[5], 0), g = sel.reduce((s, r) => s + r[6], 0);
  const days = new Set(sel.map((r) => r[0])).size || 1;
  const nsh = new Set(sel.filter((r) => r[4] > 0).map((r) => r[1])).size;
  const per = a === b ? dTH(a) : `${dTH(a)} – ${dTH(b)}`;

    ['เครื่องที่ขาย', fmt(u), per],
    ['ยอดขายสุทธิ (Net)', fmt(n) + ' ฿', 'หลังส่วนลด / แพ็กเกจ'],
    ['ราคาเต็ม (Gross)', fmt(g) + ' ฿', g ? `ส่วนลดเฉลี่ย ${fmt((g - n) / Math.max(u, 1))} ฿/เครื่อง` : ''],
    ['เฉลี่ยต่อวัน', (u / days).toLocaleString('en-US', { maximumFractionDigits: 1 }), `${days} วันที่มียอด`],
    ['Target (เครื่อง)', Tsel.length ? fmt(sumT(Tsel, 2)) : '-', Tsel.length ? `%ACH ${pct(u, sumT(Tsel, 2))} · Net ${pct(n, sumT(Tsel, 3))} (Target Net ${fmt(sumT(Tsel, 3))} ฿)` : 'ยังไม่มี Target เดือนนี้'],

  trend(all.filter((r) => mOk(r[2])), a, b);

}

function trend(rows, a, b) {
  const by = {}; rows.forEach((r) => (by[r[0]] = (by[r[0]] || 0) + r[4]));
  let d0 = a, d1 = b;
  if (d1 < addDays(d0, 13)) { d0 = addDays(d1, -13) < first ? first : addDays(d1, -13); }
  const ds = []; for (let d = d0; d <= d1 && ds.length < 400; d = addDays(d, 1)) ds.push(d);
  if (!ds.length) { $('#trend').innerHTML = '<div class="empty">ยังไม่มียอดขาย</div>'; return; }
  const W = Math.max(ds.length * 26, $('#trend').clientWidth || 900), H = 180, pb = 22, pt = 16, mx = Math.max(1, ...ds.map((d) => by[d] || 0));
  const bw = W / ds.length;
  const bars = ds.map((d, i) => {
    const v = by[d] || 0, h = (H - pb - pt) * v / mx, x = i * bw + bw * .15, y = H - pb - h;
    const on = d >= a && d <= b;
    return `<rect x="${x}" y="${y}" width="${bw * .7}" height="${h}" rx="3" fill="var(${on ? '--bar' : '--bar2'})"><title>${dTH(d)}: ${v} เครื่อง</title></rect>` +
      (v ? `<text x="${x + bw * .35}" y="${y - 3}" text-anchor="middle">${v}</text>` : '') +
      (ds.length <= 31 || i % Math.ceil(ds.length / 31) === 0 ? `<text x="${x + bw * .35}" y="${H - 6}" text-anchor="middle">${+d.slice(8)}</text>` : '');
  }).join('');
  $('#trend').innerHTML = `<div class="tw"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:${Math.min(W, 900)}px;height:auto">${bars}</svg></div>`;
  $('#trend-sub').textContent = `เครื่อง / วัน · ${dTH(ds[0])} – ${dTH(ds[ds.length - 1])}` + ' · ' + selName();
}

function table(el, cols, data, key, foot, rowAttr) {
  const st = S.sort[key] || { i: cols.findIndex((c) => c.def), dir: -1 };
  const i = st.i < 0 ? 1 : st.i;
  data.sort((x, y) => { const p = cols[i].v(x), q = cols[i].v(y); return (typeof p === 'string' ? p.localeCompare(q, 'th') : p - q) * st.dir; });
  el.innerHTML = data.length ? `<table><thead><tr>${cols.map((c, j) => `<th class="${c.l ? 'l' : ''}" data-i="${j}">${c.h}${j === i ? (st.dir > 0 ? ' ▲' : ' ▼') : ''}</th>`).join('')}</tr></thead><tbody>` +
    data.map((r) => `<tr ${rowAttr ? rowAttr(r) : ''}>${cols.map((c) => `<td class="${c.l ? 'l' : ''}">${c.f ? c.f(r) : fmt(c.v(r))}</td>`).join('')}</tr>`).join('') +
    `</tbody>${foot ? `<tfoot><tr>${foot.map((x, j) => `<td class="${cols[j].l ? 'l' : ''}">${x}</td>`).join('')}</tr></tfoot>` : ''}</table>` : '<div class="empty">ไม่มีข้อมูลในช่วงนี้</div>';
  el.querySelectorAll('th').forEach((th) => th.onclick = () => { const j = +th.dataset.i; S.sort[key] = { i: j, dir: j === i ? -st.dir : (cols[j].l ? 1 : -1) }; draw(); });
}

function selName() { return !S.fam ? 'ทุกรุ่น' : S.model ? short(S.model) : S.fam; }
function famCards(rows, stk, T0) {
  const tot = rows.reduce((s, r) => s + r[4], 0) || 1;

    const caps = D.models.filter((m) => m.fam === f).map((m) => [capOf(m.k), r.filter((x) => x[2] === m.k).reduce((s, x) => s + x[4], 0), r.filter((x) => x[2] === m.k).reduce((s, x) => s + x[5], 0)]);
    return `<button class="fam" data-f="${esc(f)}" aria-pressed="${S.fam === f}"><div class="nm">TECNO ${esc(f)}<small>${Math.round(100 * u / tot)}% ของเครื่องที่ขาย</small></div>

function modelTable(rows, stk, T0) {

  const by = S.fam ? (k, col) => k + '\u0001' + col : (k) => famOf[k];

  rows.filter((r) => !S.fam || mOk(r[2])).forEach((r) => { const x = get(by(r[2], r[3])); x.u += r[4]; x.n += r[5]; x.g += r[6]; if (r[4] > 0) x.sh.add(r[1]); });
  stk.filter((r) => !S.fam || mOk(r[1])).forEach((r) => (get(by(r[1], r[2])).s += r[4]));
  $('#mt-h').textContent = S.fam ? `รายละเอียด ${selName()}` : 'สรุปรายรุ่น';
  $('#mt-sub').textContent = S.fam ? 'แยกความจุ · สี' : 'รวมทุกความจุ · กดที่แถวเพื่อดูรายละเอียดความจุ';
  if (!S.fam) T0.forEach((r) => (get(famOf[r[1]]).t = (get(famOf[r[1]]).t || 0) + r[2]));
  const data = Object.values(m), T = (f) => data.reduce((s, x) => s + f(x), 0);
  table($('#tb-model'), [
    { h: S.fam ? 'ความจุ · สี' : 'รุ่น', l: 1, v: (x) => lab(x.k), f: (x) => esc(lab(x.k)) },
    { h: 'เครื่อง', v: (x) => x.u, def: 1 }, { h: 'Net (฿)', v: (x) => x.n }, { h: 'Net/เครื่อง', v: (x) => x.u ? x.n / x.u : 0 },
    { h: 'สาขาที่ขาย', v: (x) => x.sh.size },
  ].concat(S.fam ? [] : [{ h: 'Target', v: (x) => x.t || 0 }, { h: '%ACH', v: (x) => x.t ? x.u / x.t : 0, f: (x) => pct(x.u, x.t) }]), data, 'model',
  ['รวม', fmt(T((x) => x.u)), fmt(T((x) => x.n)), '', ''].concat(S.fam ? [] : [fmt(T((x) => x.t || 0)), pct(T((x) => x.u), T((x) => x.t || 0))]),
  (x) => S.fam ? '' : `class="click" data-f="${esc(x.k)}"`);
  $('#tb-model').querySelectorAll('tr[data-f]').forEach((tr) => tr.onclick = () => { S.fam = tr.dataset.f; S.model = ''; draw(); });
}

function bars(el, items, unit) {
  const mx = Math.max(1, ...items.map((x) => x[1]));
  el.innerHTML = items.length ? `<div class="bars">${items.map(([l, v, s]) => `<div class="bar"><span>${esc(l)}${s ? ` <span class="muted">${esc(s)}</span>` : ''}</span><div class="tr"><div class="fl" style="width:${100 * Math.max(v, 0) / mx}%"></div></div><span class="n">${fmt(v)}${unit || ''}</span></div>`).join('')}</div>` : '<div class="empty">ไม่มีข้อมูลในช่วงนี้</div>';
}

function colours(sel) {
  const c = {}; sel.forEach((r) => { const k = (S.fam ? '' : famOf[r[2]] + ' · ') + (r[3] || '-'); c[k] = (c[k] || 0) + r[4]; });
  bars($('#colours'), Object.entries(c).sort((a, b) => b[1] - a[1]));
  $('#col-sub').textContent = S.fam ? selName() : 'ทุกรุ่น (รุ่น · สี)';
}

function areaTable(sel, stk, Ts) {
  const m = {}; const get = (k) => (m[k] ||= { k, u: 0, n: 0, s: 0, sh: new Set() });
  (D.ww || []).forEach(([c, ar, ty]) => { if ((!S.area || ar === S.area) && (!S.type || ty === S.type) && ar) get(ar).t = (get(ar).t || 0) + 1; });
  sel.forEach((r) => { const x = get((shop[r[1]] || {}).area || '-'); x.u += r[4]; x.n += r[5]; if (r[4] > 0) x.sh.add(r[1]); });
  stk.forEach((r) => (get((shop[r[0]] || {}).area || '-').s += r[4]));
  const wa = Object.fromEntries((D.ww || []).map((x) => [x[0], x[1]]));
  Ts.forEach((r) => { const x = get(wa[r[0]] || '-'); x.tq = (x.tq || 0) + r[2]; });
  const data = Object.values(m), T = (f) => data.reduce((s, x) => s + f(x), 0);
  table($('#tb-area'), [
    { h: 'Area', l: 1, v: (x) => x.k, f: (x) => esc(x.k) },
    { h: 'เครื่อง', v: (x) => x.u, def: 1 }, { h: 'Net (฿)', v: (x) => x.n }, { h: 'Net/เครื่อง', v: (x) => x.u ? x.n / x.u : 0 }, { h: 'Target', v: (x) => x.tq || 0 }, { h: '%ACH', v: (x) => x.tq ? x.u / x.tq : 0, f: (x) => pct(x.u, x.tq) },
    { h: 'สาขาที่ขาย', v: (x) => x.sh.size }, { h: 'สาขาทั้งหมด', v: (x) => x.t || 0 },
  ], data, 'area', ['รวม', fmt(T((x) => x.u)), fmt(T((x) => x.n)), fmt(T((x) => x.n) / Math.max(T((x) => x.u), 1)), fmt(T((x) => x.tq || 0)), pct(T((x) => x.u), T((x) => x.tq || 0)), fmt(T((x) => x.sh.size)), fmt(T((x) => x.t || 0))]);
}

function hours(a, b) {
  const h = {}; D.hours.forEach((r) => { if (r[0] >= a && r[0] <= b && mOk(r[2])) h[r[1]] = (h[r[1]] || 0) + r[3]; });
  if (S.area || S.type) { $('#hours').innerHTML = '<div class="empty">ดูได้เฉพาะเมื่อเลือกทุกพื้นที่ / ทุกประเภทสาขา</div>'; return; }
  const ks = Object.keys(h).map(Number).sort((x, y) => x - y);
  bars($('#hours'), ks.map((k) => [`${String(k).padStart(2, '0')}:00–${String(k + 1).padStart(2, '0')}:00`, h[k]]));
}

let shopRows = [];
function shopTable(sel, stk, allRows, Ts) {
  const m = {}; const get = (c) => (m[c] ||= { c, u: 0, n: 0, s: 0, last: '' });
  sel.forEach((r) => { const x = get(r[1]); x.u += r[4]; x.n += r[5]; });
  stk.forEach((r) => (get(r[0]).s += r[4]));
  allRows.forEach((r) => { if (m[r[1]] && r[4] > 0 && r[0] > m[r[1]].last) m[r[1]].last = r[0]; });
  const tq = {}; Ts.forEach((r) => (tq[r[0]] = (tq[r[0]] || 0) + r[2]));
  Object.values(m).forEach((x) => (x.t = tq[x.c] || 0));
  const q = S.q.toLowerCase();
  shopRows = Object.values(m).filter((x) => x.u || x.n).filter((x) => !q || x.c.includes(q) || String((shop[x.c] || {}).n || '').toLowerCase().includes(q));
  const T = (f) => shopRows.reduce((s, x) => s + f(x), 0);
  table($('#tb-shop'), [
    { h: 'สาขา', l: 1, v: (x) => (shop[x.c] || {}).n || x.c, f: (x) => `${esc((shop[x.c] || {}).n || x.c)} <span class="muted">${x.c}</span>` },
    { h: 'Area', l: 1, v: (x) => (shop[x.c] || {}).area || '', f: (x) => esc((shop[x.c] || {}).area || '-') },
    { h: 'ประเภท', l: 1, v: (x) => (shop[x.c] || {}).type || '', f: (x) => esc((shop[x.c] || {}).type || '-') },
    { h: 'เครื่อง', v: (x) => x.u, def: 1 }, { h: 'Net (฿)', v: (x) => x.n },
    { h: 'Target', v: (x) => x.t, f: (x) => x.t ? fmt(x.t) : '-' }, { h: '%ACH', v: (x) => x.t ? x.u / x.t : 0, f: (x) => pct(x.u, x.t) },
    { h: 'ขายล่าสุด', v: (x) => x.last, f: (x) => dTH(x.last) },
  ], shopRows, 'shop', [`รวม ${fmt(shopRows.length)} สาขา`, '', '', fmt(T((x) => x.u)), fmt(T((x) => x.n)), fmt(T((x) => x.t)), pct(T((x) => x.u), T((x) => x.t)), '']);
}

$('#csv').onclick = () => {
  const [a, b] = range();
  const L = [['Shop Code', 'Shop', 'Area', 'Type', 'Units', 'Net', 'Target', '%ACH', 'Last sale', 'Model', 'From', 'To']].concat(shopRows.map((x) => {
    const s = shop[x.c] || {}; return [x.c, s.n || '', s.area || '', s.type || '', x.u, Math.round(x.n), Math.round(x.t * 10) / 10, x.t ? Math.round(100 * x.u / x.t) + '%' : '', x.last, selName(), a, b];
  }));
  const csv = '﻿' + L.map((r) => r.map((v) => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\r\n');
  const el = document.createElement('a'); el.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  el.download = `tecno_shops_${selName().replace(/\W+/g, '_')}_${a}_${b}.csv`; el.click();
};
$('#per').onclick = (e) => { const p = e.target.closest('button')?.dataset.p; if (p) { preset(p); draw(); } };
$('#models').onclick = (e) => { const b = e.target.closest('button'); if (b) { S.fam = b.dataset.f; S.model = ''; draw(); } };
$('#caps').onclick = (e) => { const b = e.target.closest('button'); if (b) { S.model = b.dataset.m; draw(); } };
$('#fams').onclick = (e) => { const b = e.target.closest('.fam'); if (b) { S.fam = S.fam === b.dataset.f ? '' : b.dataset.f; S.model = ''; draw(); } };
$('#area').onchange = (e) => { S.area = e.target.value; draw(); };
$('#stype').onchange = (e) => { S.type = e.target.value; draw(); };
$('#q').oninput = (e) => { S.q = e.target.value; draw(); };
$('#d1').min = $('#d2').min = first; $('#d1').max = $('#d2').max = last;
$('#d1').onchange = (e) => { S.d1 = e.target.value || first; S.p = 'custom'; draw(); }; $('#d2').onchange = (e) => { S.d2 = e.target.value || last; S.p = 'custom'; draw(); };
draw();
</script>
</body>
</html>
