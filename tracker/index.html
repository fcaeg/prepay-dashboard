<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Task Tracker – ติดตามงานสาขา</title>
<style>
:root{
  --bg:#f5f6f8;--panel:#fff;--fg:#1d2330;--muted:#6b7385;--line:#e3e6ec;
  --accent:#2f5bea;--accent-soft:#e8eeff;
  --ok:#1f9d55;--ok-soft:#e3f6ea;--warn:#d98a00;--warn-soft:#fff3d9;--bad:#d93636;--bad-soft:#fde6e6;
  --radius:12px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Noto Sans Thai","Sarabun","Leelawadee UI","Tahoma",system-ui,sans-serif;font-size:15px;line-height:1.5}
header{background:var(--panel);border-bottom:1px solid var(--line);padding:16px 20px 0}
.head-row{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px;max-width:1200px;margin:0 auto}
h1{font-size:22px;margin:0}
.sub{color:var(--muted);font-size:13px}
.src{font-size:12px;padding:3px 10px;border-radius:99px;background:var(--warn-soft);color:#8a5a00}
.src.live{background:var(--ok-soft);color:var(--ok)}
.areas{display:flex;flex-wrap:wrap;gap:6px;max-width:1200px;margin:10px auto 0}
.area-btn{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:5px 14px;font:inherit;font-size:13.5px;cursor:pointer;color:var(--fg)}
.area-btn.active{background:#1d2330;border-color:#1d2330;color:#fff}
.area-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-bottom:18px}
.tabs{display:flex;gap:4px;max-width:1200px;margin:12px auto 0;overflow-x:auto}
.tab{border:0;background:none;padding:10px 16px;font:inherit;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
main{max-width:1200px;margin:0 auto;padding:20px}
section[hidden]{display:none}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.kpi .lbl{color:var(--muted);font-size:13px}
.kpi .val{font-size:28px;font-weight:700;line-height:1.2;margin-top:4px}
.kpi .note{font-size:12px;color:var(--muted)}
.kpi.bad .val{color:var(--bad)} .kpi.ok .val{color:var(--ok)} .kpi.warn .val{color:var(--warn)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.chip-btn{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer}
.chip-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
select,input[type=search]{font:inherit;font-size:14px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--fg)}
.grow{flex:1}
h2{font-size:17px;margin:22px 0 10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px}
.card.overdue{border-left:4px solid var(--bad)}
.card.soon{border-left:4px solid var(--warn)}
.card.complete{border-left:4px solid var(--ok)}
.task-grid{display:grid;grid-template-columns:minmax(220px,1.3fr) minmax(180px,1fr) minmax(220px,1.4fr);gap:16px;align-items:start}
@media (max-width:820px){.task-grid{grid-template-columns:1fr;gap:10px}}
.t-title{font-weight:700;font-size:15.5px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;align-items:center}
.badge{font-size:12px;padding:2px 9px;border-radius:99px;background:#eef0f4;color:#3c4456;white-space:nowrap}
.badge.type{background:var(--accent-soft);color:var(--accent)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.badge.warn{background:var(--warn-soft);color:#8a5a00}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.detail{color:var(--muted);font-size:13.5px;margin-top:6px}
.bar{height:10px;background:#eceef3;border-radius:99px;overflow:hidden;margin:6px 0 4px}
.bar>span{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.ok>span{background:var(--ok)} .bar.warn>span{background:var(--warn)} .bar.bad>span{background:var(--bad)}
.pct{font-size:22px;font-weight:700}
.small{font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chip{font-size:12.5px;padding:2px 9px;border-radius:6px;background:var(--bad-soft);color:#9b1c1c;cursor:pointer;border:0;font-family:inherit}
.chip.partial{background:var(--warn-soft);color:#8a5a00}
.chip.done{background:var(--ok-soft);color:var(--ok);cursor:default}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btn{font:inherit;font-size:13.5px;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);cursor:pointer;color:var(--fg);text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:hover{filter:brightness(.97)}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
th{background:#f0f2f6;font-size:13px;color:var(--muted);font-weight:600}
tr.click{cursor:pointer} tr.click:hover td{background:#f8f9fc}
td.num{text-align:right;white-space:nowrap}
.table-wrap{overflow-x:auto}
.empty{color:var(--muted);text-align:center;padding:24px;background:var(--panel);border:1px dashed var(--line);border-radius:var(--radius)}
.branch-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.branch-head select{font-size:16px;padding:9px 12px;min-width:260px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1d2330;color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
.banner{background:var(--warn-soft);color:#6b4500;border-radius:10px;padding:10px 14px;font-size:13.5px;margin-bottom:16px}
.day-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:22px 0 10px}
.day-head h2{margin:0}
.session{display:grid;grid-template-columns:110px 1fr;gap:14px}
@media (max-width:600px){.session{grid-template-columns:1fr;gap:4px}}
.s-time{font-weight:700;color:var(--accent);font-size:15px;white-space:nowrap}
.att{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.att-row{font-size:13.5px;margin:3px 0}
.att-row b{font-weight:600}
.person{display:inline-block;background:#eef0f4;border-radius:6px;padding:1px 8px;margin:2px 4px 2px 0;font-size:13px}
.person.hit{background:var(--warn-soft);color:#6b4500;font-weight:600}
.attach{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.attach img{width:96px;height:96px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:#eef0f4;display:block}
.staffbox{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.staffbox details{border:1px solid var(--line);border-radius:8px;margin:6px 0;background:#fafbfc}
.staffbox summary{cursor:pointer;padding:6px 10px;font-size:13.5px;font-weight:600;list-style:none}
.staffbox summary::-webkit-details-marker{display:none}
.staffbox .who{display:flex;align-items:center;gap:8px;padding:4px 12px;font-size:13.5px;border-top:1px solid #eef0f4}
.staffbox .who input{width:18px;height:18px;accent-color:var(--ok)}
.staffbox .who.done span{color:var(--muted);text-decoration:line-through}
.staffbox .who small{color:var(--muted);margin-left:auto;font-size:12px}
.staffbox .who select{font:inherit;font-size:12px;padding:2px 4px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--muted)}
.staffbox .who.excl span{color:#9aa1ad;text-decoration:line-through}
.staffbox .who .fbtag{font-size:11.5px;padding:1px 7px;border-radius:99px;background:var(--warn-soft);color:#8a5a00;white-space:nowrap}
.staffbox .mv{display:flex;gap:6px;align-items:center;padding:4px 12px 8px 38px}
.staffbox .mv input{font:inherit;font-size:13px;padding:4px 8px;border:1px solid var(--line);border-radius:6px;width:220px}
.br-grid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px;align-items:start}
.br-side{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;background:#eef1f7;border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px}
.side-head{font-weight:700;font-size:15px;margin:10px 2px 8px}
.side-card{margin-bottom:10px;padding:12px}
.side-card .t-title{font-size:14.5px}
.empty.small{padding:12px;font-size:13px}
@media (max-width:980px){.br-grid{grid-template-columns:1fr}.br-side{position:static;max-height:none;order:-1}}
.names{font-size:13px;color:#9b1c1c}
</style>
</head>
<body>
<header>
  <div class="head-row">
    <div>
      <h1>📋 Task Tracker – ติดตามงานสาขา</h1>
      <div class="sub"><span id="today"></span><span id="upd"></span></div>
    </div>
    <span class="src" id="src">ข้อมูลตัวอย่าง</span>
  </div>
  <div class="areas" id="areas"></div>
  <nav class="tabs">
    <button class="tab active" data-tab="summary">สรุปทุกงาน</button>
    <button class="tab" data-tab="daily">งานประจำ</button>
    <button class="tab" data-tab="rank">ภาพรวมสาขา</button>
    <button class="tab" data-tab="branch">รายสาขา</button>
    <button class="tab" data-tab="exam">ติดตามการสอบ</button>
    <button class="tab" data-tab="training">แจ้งอบรม</button>
    <button class="tab" data-tab="history">History</button>
  </nav>
</header>

<main>
  <div id="banner"></div>

  <!-- ========== TAB 1: SUMMARY ========== -->
  <section id="tab-summary">
    <div class="kpis" id="sum-kpis"></div>
    <div id="sum-areas"></div>
    <div class="toolbar" id="sum-cats">
      <button class="chip-btn active" data-cat="all">📋 ทุกประเภท</button>
      <button class="chip-btn" data-cat="onetime">📌 One Time</button>
      <button class="chip-btn" data-cat="Daily">🔁 Daily</button>
      <button class="chip-btn" data-cat="Weekly">🗓️ Weekly</button>
      <button class="chip-btn" data-cat="Monthly">📆 Monthly</button>
      <button class="chip-btn" data-cat="exam">📝 การสอบ</button>
      <button class="chip-btn" data-cat="training">📚 อบรม</button>
    </div>
    <div class="toolbar">
      <button class="chip-btn active" data-f="open">ยังค้าง</button>
      <button class="chip-btn" data-f="overdue">เลยกำหนด</button>
      <button class="chip-btn" data-f="done">Job Done (History)</button>
      <button class="chip-btn" data-f="all">ทั้งหมด</button>
      <select id="sum-type"></select>
      <input type="search" id="sum-q" class="grow" placeholder="ค้นหาชื่องาน…">
    </div>
    <div id="sum-list"></div>
    <div class="small" style="margin-top:14px">ดูอันดับสาขาที่ค้างงานได้ที่แท็บ <a href="#rank" onclick="showTab('rank');return false">ภาพรวมสาขา →</a></div>
  </section>

  <!-- ========== TAB: RANK ========== -->
  <section id="tab-rank" hidden>
    <div class="kpis" id="rk-kpis"></div>
    <div class="toolbar">
      <button class="chip-btn active" data-rk="all">ทุกสาขา</button>
      <button class="chip-btn" data-rk="pend">มีงานค้าง</button>
      <button class="chip-btn" data-rk="over">มีงานเลยกำหนด</button>
      <button class="chip-btn" data-rk="done">ทำครบแล้ว</button>
      <input type="search" id="rk-q" class="grow" placeholder="ค้นหาชื่อสาขา / Codeshop…">
    </div>
    <div class="small" style="margin:-4px 0 8px">เรียงจากสาขาที่เลยกำหนดและค้างมากที่สุด · กดที่แถวเพื่อเปิดหน้าสาขา</div>
    <div class="table-wrap"><table id="rank"></table></div>
  </section>

  <!-- ========== TAB 2: BRANCH ========== -->
  <section id="tab-branch" hidden>
    <div class="branch-head">
      <select id="br-select"></select>
      <button class="btn" id="br-link">🔗 คัดลอกลิงก์ของสาขานี้</button>
    </div>
    <div class="kpis" id="br-kpis"></div>
    <div id="br-body"></div>
  </section>

  <!-- ========== TAB 3: EXAM ========== -->
  <section id="tab-exam" hidden>
    <div class="toolbar">
      <select id="ex-select"></select>
      <select id="ex-branch"></select>
      <button class="btn" id="ex-copy">📋 คัดลอกข้อความตามคนที่ยังไม่สอบ</button>
      <a class="btn primary" id="ex-open" target="_blank" rel="noopener">เปิดลิงก์สอบ ↗</a>
    </div>
    <div class="kpis" id="ex-kpis"></div>
    <div class="toolbar">
      <button class="chip-btn active" data-exv="branch">🏪 สรุปรายสาขา</button>
      <button class="chip-btn" data-exv="staff">👥 รายชื่อพนักงาน</button>
    </div>
    <div class="table-wrap" id="ex-wrap"><table id="ex-table"></table></div>
    <div id="ex-staff" hidden></div>
  </section>
  <!-- ========== TAB: DAILY ========== -->
  <section id="tab-daily" hidden>
    <div class="toolbar">
      <button class="chip-btn active" data-dy="today">ต้องทำวันนี้</button>
      <button class="chip-btn" data-dy="Daily">Daily</button>
      <button class="chip-btn" data-dy="Weekly">Weekly</button>
      <button class="chip-btn" data-dy="Monthly">Monthly</button>
      <button class="chip-btn" data-dy="all">ทั้งหมด</button>
      <button class="btn" id="dy-copy">📋 คัดลอกงานที่ต้องทำวันนี้ส่งไลน์</button>
    </div>
    <div class="kpis" id="dy-kpis"></div>
    <div id="dy-list"></div>
  </section>

  <!-- ========== TAB: HISTORY ========== -->
  <section id="tab-history" hidden>
    <div class="toolbar">
      <select id="hi-month"></select>
      <input type="search" id="hi-q" class="grow" placeholder="ค้นหางานที่เสร็จแล้ว…">
    </div>
    <div class="kpis" id="hi-kpis"></div>
    <div id="hi-list"></div>
  </section>

  <!-- ========== TAB 4: TRAINING ========== -->
  <section id="tab-training" hidden>
    <div class="toolbar">
      <button class="chip-btn active" data-tr="upcoming">วันนี้เป็นต้นไป</button>
      <button class="chip-btn" data-tr="week">7 วันข้างหน้า</button>
      <button class="chip-btn" data-tr="past">ที่ผ่านมา</button>
      <button class="chip-btn" data-tr="all">ทั้งหมด</button>
      <input type="search" id="tr-q" class="grow" placeholder="ค้นหาหัวข้อ / ชื่อผู้เข้าอบรม / สาขา…">
    </div>
    <div class="kpis" id="tr-kpis"></div>
    <div id="tr-list"></div>
  </section>
</main>
<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   ตั้งค่าแหล่งข้อมูล
   - ปล่อย sheetId ว่าง = ใช้ข้อมูลตัวอย่าง
   - ใส่ ID ของ Google Sheet (แชร์แบบ "ทุกคนที่มีลิงก์ดูได้") = ดึงข้อมูลจริงจากแต่ละแท็บ
   ===================================================================== */
const CONFIG = {
  sheetId: '1309rgyaiWMWj-Xik2-4T3wWgizLMivLrwH2JTx08qCg',
  tabs: { branches:'Branches', tasks:'Tasks', done:'Done', exams:'Exams', staff:'Staff', results:'ExamResults', trainings:'Trainings', attendees:'TrainingAttendees', daily:'Daily', history:'History', taskstaff:'TaskStaff' }
};

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  if (attrs) for (const k in attrs){
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'style') el.setAttribute('style', v);
    else el.setAttribute(k, v);
  }
  for (const c of kids.flat()){
    if (c == null || c === false) continue;
    el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return el;
}
const sod = d => { const x = new Date(d); x.setHours(0,0,0,0); return x; };
const TODAY = sod(new Date());
const iso = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const plus = n => { const d = new Date(TODAY); d.setDate(d.getDate()+n); return iso(d); };
function parseDate(s){
  if (!s) return null; s = String(s).trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if (m) return new Date(+m[1], m[2]-1, +m[3]);
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if (m){ let y = +m[3]; if (y > 2400) y -= 543; return new Date(y, m[2]-1, +m[1]); }
  m = s.match(/^Date\((\d+),(\d+),(\d+)/); if (m) return new Date(+m[1], +m[2], +m[3]);
  const d = new Date(s); return isNaN(d) ? null : sod(d);
}
const thDate = d => d ? d.toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'2-digit'}) : '-';
const daysLeft = d => d ? Math.round((d - TODAY)/86400000) : null;
function dueBadge(d, finished){
  if (finished) return h('span',{class:'badge ok',text:'✓ ครบแล้ว'});
  const n = daysLeft(d);
  if (n == null) return h('span',{class:'badge',text:'ไม่ระบุ Due'});
  if (n < 0) return h('span',{class:'badge bad',text:`เลยกำหนด ${-n} วัน`});
  if (n === 0) return h('span',{class:'badge warn',text:'ครบกำหนดวันนี้'});
  if (n === 1) return h('span',{class:'badge warn',text:'ครบกำหนดพรุ่งนี้'});
  return h('span',{class:'badge',text:`อีก ${n} วัน`});
}
const pctTxt = p => Math.round(p*100) + '%';
const splitLinks = s => String(s||'').split(/\s+/).filter(u=>/^https?:\/\//.test(u));
function linkLabel(u){ return /forms\.gle|\/forms\//.test(u)?'ฟอร์ม':/spreadsheets/.test(u)?'ชีต':/document/.test(u)?'เอกสาร':/presentation/.test(u)?'สไลด์':/drive\.google/.test(u)?'โฟลเดอร์':/lookerstudio|datastudio/.test(u)?'Dashboard':'ลิงก์'; }
const EXCL_FB = /ลาออก|ลาคลอด|ลายาว|พักงาน|ไม่ใช่พนักงาน|resign/i;
const FB_OPTS = ['ลาออก', 'ย้ายสาขา', 'ลาคลอด / ลายาว', 'ไม่ใช่พนักงานสาขานี้'];
const openDet = new Set();
const moveOpen = new Set();
async function postFeedback(t, x, fb, newCode){
  const row = (D.taskstaff||[]).find(r => r.task_id===t.task_id && (r.emp_id||r.name)===x.key);
  if (row) {
    const orig = row.orig_branch || row.branch_code;
    const moved = /ย้าย/.test(fb) && newCode;
    row.feedback = fb; row.orig_branch = moved ? orig : ''; row.branch_code = moved ? newCode : orig;
  }
  MODEL = build(D); rerenderAll();
  if (!D.webAppUrl) { toast('⚠️ ยังไม่ได้ตั้งค่า Web App URL – Feedback จะไม่ถูกบันทึก'); return; }
  pendingPosts++;
  try {
    await fetch(D.webAppUrl, {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({action:'staffFeedback', task_id:t.task_id, key:x.key, feedback:fb, new_branch:newCode||'', by:'หน้าเว็บ'})});
    toast(fb ? `บันทึก Feedback: ${x.name} – ${fb}${newCode?' → '+((MODEL.bmap[newCode]||{}).name||newCode):''}` : 'ยกเลิก Feedback: '+x.name);
  } catch (e) { toast('บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง'); }
  finally { pendingPosts--; }
}
function staffRow(t, x){
  const mk = t.task_id+'|'+x.key;
  const sel = h('select',{title:'Feedback', onchange: ev => {
      const v = ev.target.value;
      if (v === 'ย้ายสาขา') { moveOpen.add(mk); rerenderAll(); return; }
      moveOpen.delete(mk); postFeedback(t, x, v, ''); }},

function parseCSV(text){
  const rows=[]; let row=[], f='', q=false;
  for (let i=0;i<text.length;i++){
    const c=text[i];
    if (q){ if (c=='"'){ if (text[i+1]=='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if (c=='"') q=true;
    else if (c==','){ row.push(f); f=''; }
    else if (c=='\n'){ row.push(f); rows.push(row); row=[]; f=''; }
    else if (c!='\r') f+=c;
  }
  if (f!=='' || row.length){ row.push(f); rows.push(row); }
  const head = (rows.shift()||[]).map(s=>s.trim());
  return rows.filter(r=>r.some(v=>v.trim()!=='')).map(r=>Object.fromEntries(head.map((k,i)=>[k,(r[i]||'').trim()])));
}
async function loadSheet(){
  const out = {};
  for (const [key, tab] of Object.entries(CONFIG.tabs)){
    const url = `https://docs.google.com/spreadsheets/d/${CONFIG.sheetId}/gviz/tq?tqx=out:csv&headers=1&sheet=${encodeURIComponent(tab)}`;
    const KEYCOL = {branches:'code',tasks:'task_id',done:'task_id',exams:'exam_id',staff:'emp_id',results:'exam_id',trainings:'training_id',attendees:'training_id',daily:'title',history:'task_id',taskstaff:'task_id'};
    const OPTIONAL = ['trainings','attendees','daily','history','taskstaff'];
    try {
      const res = await fetch(url); if (!res.ok) throw new Error(tab);
      const rows = parseCSV(await res.text());
      // ถ้าไม่มีแท็บนี้ Google จะส่งแท็บแรกมาแทน จึงเช็กหัวคอลัมน์ก่อน
      out[key] = rows.length && !(KEYCOL[key] in rows[0]) ? [] : rows;
    } catch (err) { if (OPTIONAL.includes(key)) out[key] = []; else throw err; }
  }
  try {   // Settings ไม่มีหัวตาราง → อ่านเป็นแถว key,value
    const res = await fetch(`https://docs.google.com/spreadsheets/d/${CONFIG.sheetId}/gviz/tq?tqx=out:csv&headers=0&sheet=Settings`);
    const txt = await res.text();
    txt.split(/\r?\n/).forEach(line => { const m = line.match(/^"Web App URL","([^"]+)"/); if (m && /^https:\/\/script\.google\.com\//.test(m[1])) out.webAppUrl = m[1]; });
  } catch (e) {}
  return out;
}

/* ---------- คำนวณ ---------- */
let D, MODEL, AREA = 'ALL';
const norm = s => String(s||'').toLowerCase().replace(/[\s_\-]+/g,'');
const initials = s => String(s||'').split(/\s+/).map(w=>w[0]||'').join('').toLowerCase();
const areaOf = b => (b.area || b.zone || '').trim() || 'ไม่ระบุ Area';
function allAreas(){ return [...new Set(D.branches.filter(b=>b.code).map(areaOf))]; }
function targetsOf(t, branches, bmapAll){
  const raw = (t.branches||'').trim();
  if (!raw || /^(all|ทุกสาขา)$/i.test(raw)) return branches;
  const set = new Set();
  raw.split(/[,;\n]+/).map(x=>x.trim()).filter(Boolean).forEach(tok => {
    const n = norm(tok);
    const byArea = branches.filter(b => norm(areaOf(b))===n || initials(areaOf(b))===n);
    if (byArea.length) byArea.forEach(b=>set.add(b.code));
    else tok.split(/\s+/).forEach(c => { if (bmapAll[c.toUpperCase()] || bmapAll[c]) set.add(bmapAll[c.toUpperCase()] ? c.toUpperCase() : c); });
  });
  return branches.filter(b=>set.has(b.code));
}
function build(data){
  const allBr = data.branches.filter(b=>b.code);
  const bmapAll = Object.fromEntries(allBr.map(b=>[b.code,b]));
  const branches = AREA==='ALL' ? allBr : allBr.filter(b=>areaOf(b)===AREA);
  const bmap = Object.fromEntries(branches.map(b=>[b.code,b]));
  const doneMap = {};
  data.done.forEach(d => { const st = (d.status||'done').toLowerCase().includes('partial') || d.status==='บางส่วน' ? 'partial' : 'done'; doneMap[d.task_id+'|'+d.branch_code] = st; });
  const staffBy = {};
  (data.taskstaff||[]).forEach(x => { if (!x.task_id || !x.name) return; const k = x.emp_id || x.name;
    ((staffBy[x.task_id] = staffBy[x.task_id] || {})[x.branch_code] = staffBy[x.task_id][x.branch_code] || []).push({...x, key: k, done: /^y/i.test(x.done||''), excl: EXCL_FB.test(x.feedback||'')}); });
  const staffOf = id => { const sb = staffBy[id]; if (!sb) return null; const o = {}; Object.entries(sb).forEach(([c,l]) => { if (bmap[c]) o[c] = l; }); return Object.keys(o).length ? o : null; };
  const staffSt = (staff, code) => { const l0 = staff && staff[code]; if (!l0) return null; const l = l0.filter(x=>!x.excl); const d = l.filter(x=>x.done).length; return d===l.length ? 'done' : d ? 'partial' : 'pending'; };
  const mkTask = t => {
    const tracked = String(t.tracked_branches||'').split(/[,\s]+/).filter(Boolean);
    const list = targetsOf(t, allBr, bmapAll).filter(b=>bmap[b.code] && (!tracked.length || tracked.includes(b.code)));
    const due = parseDate(t.due);
    const staffT = staffOf(t.task_id);
    const per = (staffT ? allBr.filter(b => staffT[b.code]) : list).map(b => ({b, st: staffT ? staffSt(staffT, b.code) : (doneMap[t.task_id+'|'+b.code] || 'pending')}));
    if (staffT) list.splice(0, list.length, ...per.map(x=>x.b));
    const doneN = per.filter(x=>x.st==='done').length;
    const pending = per.filter(x=>x.st!=='done');
    const pct = list.length ? doneN/list.length : 1;
    const complete = pending.length === 0;
    const dl = daysLeft(due);
    const staff = staffT;
    return {...t, due, list, per, doneN, pending, pct, complete, staff, overdue: !complete && dl!=null && dl<0, soon: !complete && dl!=null && dl>=0 && dl<=1};
  };
  const tasks = data.tasks.filter(t=>t.task_id).map(mkTask).filter(t => t.list.length);
  const history = (data.history||[]).filter(t=>t.task_id).map(mkTask).filter(t => t.list.length)
    .map(t => ({...t, completedAt: parseDate(String(t.completed_at||'').slice(0,10)), completedTxt: String(t.completed_at||'')}))
    .sort((a,b) => String(b.completed_at||'').localeCompare(String(a.completed_at||'')));
  const passOf = e => Number(e.pass_score) || 0;
  const exams = data.exams.filter(e=>e.exam_id).map(e => {
    const res = {}; data.results.filter(x=>x.exam_id===e.exam_id).forEach(x => { const s = Number(x.score); if (!(x.emp_id in res) || s > res[x.emp_id]) res[x.emp_id] = s; });
    let staff = null;
    if (staffBy[e.exam_id]) { staff = {}; Object.entries(staffBy[e.exam_id]).forEach(([c, l]) => { if (bmap[c]) staff[c] = l; }); }
    return {...e, task_id: e.exam_id, staff, due: parseDate(e.due), res, pass: passOf(e)};
  });
  const staffById = Object.fromEntries((data.staff||[]).map(s=>[s.emp_id,s]));
  const hhmm = t => { const m = String(t||'').match(/(\d{1,2})[:.](\d{2})/); return m ? m[1].padStart(2,'0')+':'+m[2] : ''; };
  const trainings = (data.trainings||[]).filter(t=>t.training_id).map(t => {
    const att = (data.attendees||[]).filter(a=>a.training_id===t.training_id).map(a => {
      const st = staffById[a.emp_id] || {};
      const code = a.branch_code || st.branch_code || '';
      return {name: a.name || st.name || a.emp_id || '-', code, b: bmapAll[code] || null, note: a.note || ''};
    }).filter(a => a.b && bmap[a.code]);                           // เฉพาะสาขาในพื้นที่ของเรา
    const tracked = String(t.tracked_branches||'').split(/[,\s]+/).filter(Boolean);
    const sentAll = new Set(att.map(a=>a.code));

    if (allMgmt) req = Object.keys(bmap);
    const sent = new Set([...sentAll, ...(staffT ? Object.keys(staffT) : [])]);
    const missing = req.filter(c => !sent.has(c)).map(c => bmap[c]);
    const byBr = req.map(c => ({b: bmap[c], ps: att.filter(a=>a.code===c)}));
    return {...t, task_id: t.training_id, staff: staffT, date: parseDate(t.date), start: hhmm(t.start), end: hhmm(t.end), att, req, missing, byBr, allMgmt, regLink: tracked.length > 0};
  }).filter(t => t.date && t.req.length)
    .sort((a,b)=> a.date-b.date || a.start.localeCompare(b.start));
  const todayIso = iso(TODAY);
  const daily = (data.daily||[]).filter(d => d.title && !/^(n|no|ไม่|0|false)$/i.test(String(d.active||'').trim())).map(d => {
    const tracked = String(d.tracked_branches||'').split(/[,\s]+/).filter(Boolean);
    const list = targetsOf(d, allBr, bmapAll).filter(b=>bmap[b.code] && (!tracked.length || tracked.includes(b.code)));
    const flag = String(d.auto_check||'').trim();
    const auto = /^(y|yes|✓|true|1|ใช่)$/i.test(flag) || (!flag && String(d.check_tab||'').trim() !== '');
    // สถานะของวันนี้เท่านั้น (ผลตรวจของวันก่อนไม่นับ)
    const st = {}; (data.done||[]).forEach(x => { if (x.task_id===d.daily_id && String(x.updated||'').slice(0,10)===todayIso) st[x.branch_code] = String(x.status||'done').includes('partial') ? 'partial' : 'done'; });
    const staffD = staffOf(d.daily_id);
    const checkedToday = !!staffD || String(d.check_log||'').slice(0,10)===todayIso;
    const per = (staffD ? allBr.filter(b => staffD[b.code]) : list).map(b => ({b, st: staffD ? staffSt(staffD, b.code) : (st[b.code] || 'pending')}));
    if (staffD) list.splice(0, list.length, ...per.map(x=>x.b));
    const doneN = per.filter(x=>x.st==='done').length;
    return {...d, task_id: d.daily_id, staff: staffD, list, per, doneN, pending: per.filter(x=>x.st!=='done'), auto: auto || !!staffD, checkedToday,

}
function lineMsg(t){

let dyFilter = 'today';
const TH_DOW = [['อา','อาทิตย์','sun'],['จ','จันทร์','mon'],['อ','อังคาร','tue'],['พ','พุธ','wed'],['พฤ','พฤหัส','thu'],['ศ','ศุกร์','fri'],['ส','เสาร์','sat']];
function dowOf(tok){ tok = tok.trim().toLowerCase().replace(/\.$/,''); return TH_DOW.findIndex(a => a.some(x => tok === x || (x.length > 2 && tok.startsWith(x)))); }
function dayMatch(spec, date){
  if (typeof date === 'number'){ const d = new Date(TODAY); d.setDate(d.getDate() + (date - d.getDay())); date = d; }
  const dow = date.getDay();
  spec = String(spec||'').trim();
  // รายเดือน: "วันที่ 5", "วันที่ 1,15", "สิ้นเดือน"
  const last = new Date(date.getFullYear(), date.getMonth()+1, 0).getDate();
  if (/สิ้นเดือน|end of month/i.test(spec)) return date.getDate() === last;
  const mm = spec.match(/วันที่\s*([\d,\s\-–]+)/);
  if (mm) return mm[1].split(/[,\s]+/).filter(Boolean).some(x => { const r = x.split(/[-–]/).map(Number); const dd = date.getDate();
    return r.length === 2 ? dd >= r[0] && dd <= r[1] : (dd === r[0] || (r[0] > last && dd === last)); });
  if (!spec || /ทุกวัน|every|daily|all/i.test(spec)) return true;
  if (/จ\s*[-–]\s*ศ|weekday|วันทำการ/i.test(spec)) return dow>=1 && dow<=5;
  if (/เสาร์\s*[-–]?\s*อาทิตย์|ส\s*[-–]\s*อา|weekend/i.test(spec)) return dow===0 || dow===6;
  return spec.split(/[,\s/]+/).some(part => {
    const r = part.split(/[-–]/); if (r.length === 2){ const a = dowOf(r[0]), b = dowOf(r[1]); if (a<0||b<0) return false; return a<=b ? dow>=a && dow<=b : dow>=a || dow<=b; }
    return dowOf(part) === dow;
  });
}
function deadlineBadge(d){
  if (!d.deadline) return null;
  if (!d.today) return h('span',{class:'badge',text:'⏰ '+d.deadline});
  const [H,M] = d.deadline.split(':').map(Number), now = new Date(), late = now.getHours()*60+now.getMinutes() > H*60+M;
  return h('span',{class:'badge '+(late?'bad':'warn'),text:(late?'⏰ เลยเวลา ':'⏰ ภายใน ')+d.deadline+' น.'});
}
const scopeTxt = d => d.list.length === MODEL.branches.length ? (AREA==='ALL'?'ทุกสาขา':'ทุกสาขาใน '+AREA) : `${d.list.length} สาขา`;
function dailyCard(d, compact){
  return h('div',{class:'card '+(d.today?'':'complete'),style:d.today?'':'opacity:.6'},
    h('div',{class:'t-title',text:d.title}),
    h('div',{class:'meta'}, deadlineBadge(d), h('span',{class:'badge type',text:'🔁 '+d.frequency}), h('span',{class:'badge',text:'📅 '+(d.days||'ทุกวัน')}), compact?null:h('span',{class:'badge',text:'🏪 '+scopeTxt(d)})),
    d.detail ? h('div',{class:'detail',style:'white-space:pre-line',text:d.detail}) : null,
    (d.auto && d.today && !compact) ? (d.checkedToday ? h('div',{style:'margin-top:8px'},
        h('div',null, h('span',{class:'pct',text:pctTxt(d.list.length?d.doneN/d.list.length:1)}), h('span',{class:'small',text:`  ทำแล้ววันนี้ ${d.doneN}/${d.list.length} สาขา · 🔄 ตรวจล่าสุด ${String(d.check_log).slice(11,16)}`})),
        bar(d.list.length?d.doneN/d.list.length:1),
        branchGroups(d.per))
      : h('div',{class:'small',style:'margin-top:6px',text:'🔄 ตรวจอัตโนมัติ – ยังไม่มีผลตรวจของวันนี้'})) : null,
    (d.auto && d.today && compact && d.checkedToday && d._me) ? h('div',{style:'margin-top:6px'}, d._me.st==='done' ? h('span',{class:'badge ok',text:'✓ ทำแล้ววันนี้'}) : d._me.st==='partial' ? h('span',{class:'badge warn',text:'ทำบางส่วน'}) : h('span',{class:'badge bad',text:'ยังไม่ทำวันนี้'})) : null,
    d.staff ? staffBox(d, compact && d._me ? d._me.b.code : null) : null,
    h('div',{class:'actions'}, splitLinks(d.link).length ? linkBtns(d,true,'เปิดลิงก์') : null,
      (!compact && d.auto && d.today && d.checkedToday && d.pending.length) ? h('button',{class:'btn',onclick:()=>copy(`📌 ${d.title} (${thDay(TODAY)})\nยังไม่ดำเนินการ ${d.pending.length}/${d.list.length} สาขา:\n`+d.pending.map(x=>'• '+x.b.name+(x.st==='partial'?' (บางส่วน)':'')).join('\n')+(splitLinks(d.link)[0]?'\n\nลิงก์: '+splitLinks(d.link)[0]:'')+'\nรบกวนดำเนินการด้วยครับ/ค่ะ 🙏'),text:'📋 คัดลอกข้อความตามสาขาที่ค้าง'}) : null));
}
function dailyMsg(){
  const ds = MODEL.daily.filter(d=>d.today);
  return `📌 งานประจำที่ต้องทำ ${thDay(TODAY)}${AREA!=='ALL'?' ['+AREA+']':''}\n` + ds.map(d =>
    `━━━━━━━━━━\n${d.frequency!=='Daily'?'['+d.frequency+'] ':''}${d.deadline?'⏰ ภายใน '+d.deadline+' น. ':''}${d.title}` + (d.detail?`\n📝 ${d.detail}`:'') +
    (d.list.length < MODEL.branches.length ? `\n🏪 ${d.list.map(b=>b.name).join(', ')}` : '') +
    splitLinks(d.link).map(u=>`\n🔗 ${u}`).join('')).join('\n');
}
function renderDaily(){
  const all = MODEL.daily, today = all.filter(d=>d.today);
  const list = dyFilter==='today' ? today : dyFilter==='all' ? all : all.filter(d=>d.frequency===dyFilter);
  const now = new Date(), late = today.filter(d => d.deadline && now.getHours()*60+now.getMinutes() > d.deadline.split(':').reduce((a,x,i)=>a+(i?+x:+x*60),0));
  $('#dy-kpis').replaceChildren(
    kpi('งานประจำที่ต้องทำวันนี้', today.length+' งาน', `Daily ${today.filter(d=>d.frequency==='Daily').length} · Weekly ${today.filter(d=>d.frequency==='Weekly').length} · Monthly ${today.filter(d=>d.frequency==='Monthly').length}`),
    kpi('เลยเวลาที่กำหนดแล้ว', late.length+' งาน', 'ของวันนี้', late.length?'bad':'ok'));
  $('#dy-list').replaceChildren(...(list.length ? list.map(d=>dailyCard(d)) : [h('div',{class:'empty',text: dyFilter==='today' ? 'วันนี้ไม่มีงานประจำที่ต้องทำ' : 'ยังไม่มีงานประจำ – เลือกรอบงาน Daily / Weekly / Monthly ในฟอร์ม'})]));
}

/* ---------- TAB 4: แจ้งอบรม ---------- */
let trFilter = 'upcoming';
const thDay = d => d.toLocaleDateString('th-TH',{weekday:'long',day:'numeric',month:'short',year:'2-digit'});
const dayRel = d => { const n = daysLeft(d); return n===0?'วันนี้':n===1?'พรุ่งนี้':n===-1?'เมื่อวาน':n>0?`อีก ${n} วัน`:`${-n} วันที่แล้ว`; };
function groupByBranch(att){
  const g = new Map();
  att.forEach(a => { const k = a.b ? a.b.name : (a.code || 'ไม่ระบุสาขา'); if (!g.has(k)) g.set(k, []); g.get(k).push(a); });
  return [...g.entries()];
}
function agendaMsg(d, list){
  return `📅 Agenda อบรม ${thDay(d)}${AREA!=='ALL'?' ['+AREA+']':''}\n` + list.map(t =>
    `━━━━━━━━━━\n🕘 ${t.start}${t.end?'–'+t.end:''} ${t.title}` +
    (t.location?`\n📍 ${t.location}`:'') + (t.trainer?`\n🎤 ${t.trainer}`:'') +
    `\n🏪 สาขาที่ต้องเข้าอบรม ${t.req.length} สาขา` +
    t.byBr.map(x => `\n• ${x.b.name}: ${x.ps.length ? x.ps.map(p=>p.name).join(', ') : 'Management'}`).join('') +
    (splitLinks(t.link)[0]?`\n🔗 ${splitLinks(t.link)[0]}`:'') + (t.detail?`\n📝 ${t.detail}`:'')
  ).join('\n');
}
function renderTraining(){
  const q = $('#tr-q').value.trim().toLowerCase();
  let list = MODEL.trainings.filter(t => {
    const n = daysLeft(t.date);
    return trFilter==='all' || (trFilter==='upcoming' && n>=0) || (trFilter==='week' && n>=0 && n<=7) || (trFilter==='past' && n<0);
  });
  if (trFilter==='past') list = list.slice().reverse();
  const hit = p => q && (p.name.toLowerCase().includes(q) || (p.b && p.b.name.toLowerCase().includes(q)) || p.code.toLowerCase().includes(q));
  if (q) list = list.filter(t => (t.title+' '+(t.location||'')+' '+(t.trainer||'')).toLowerCase().includes(q) || t.att.some(hit));
  const up = MODEL.trainings.filter(t=>daysLeft(t.date)>=0);
  const soon = MODEL.trainings.filter(t=>{const n=daysLeft(t.date); return n===0||n===1;});
  $('#tr-kpis').replaceChildren(
    kpi('หัวข้ออบรมที่จะถึง', up.length, 'ตั้งแต่วันนี้เป็นต้นไป'),
    kpi('สาขาที่ต้องเข้าอบรม', new Set(up.flatMap(t=>t.req)).size+' สาขา', `ระบุชื่อแล้ว ${up.reduce((a,t)=>a+t.att.length,0)} คน`),
    kpi('วันนี้–พรุ่งนี้', soon.length+' รายการ', soon.reduce((a,t)=>a+t.att.length,0)+' คน', soon.length?'warn':'')
  );
  const box = $('#tr-list');
  if (!list.length){ box.replaceChildren(h('div',{class:'empty',text: q ? 'ไม่พบรายการที่ค้นหา' : 'ไม่มีรายการอบรมในช่วงนี้'})); return; }
  const days = new Map(); list.forEach(t => { const k = iso(t.date); if (!days.has(k)) days.set(k, []); days.get(k).push(t); });
  box.replaceChildren(...[...days.values()].map(ts => { const d = ts[0].date, n = daysLeft(d); return h('div',null,
    h('div',{class:'day-head'},
      h('h2',{text:'📅 '+thDay(d)}),
      h('span',{class:'badge '+(n===0?'bad':n===1?'warn':''),text:dayRel(d)}),
      h('span',{class:'small',text:`${ts.length} รายการ · ${ts.reduce((a,t)=>a+t.att.length,0)} คน`}),
      h('button',{class:'btn',onclick:()=>copy(agendaMsg(d,ts)),text:'📋 คัดลอก Agenda วันนี้ส่งไลน์'})),
    ts.map(t => h('div',{class:'card '+(n===0?'soon':'')},
      h('div',{class:'session'},
        h('div',{class:'s-time',text:t.start ? t.start+(t.end?' – '+t.end:'') : 'ไม่ระบุเวลา'}),
        h('div',null,
          h('div',{class:'t-title',text:t.title}),
          h('div',{class:'meta'},
            t.location ? h('span',{class:'badge type',text:'📍 '+t.location}) : null,
            t.trainer ? h('span',{class:'badge',text:'🎤 '+t.trainer}) : null),
          t.detail ? h('div',{class:'detail',style:'white-space:pre-line',text:t.detail}) : null,
          attachBox(t),
          splitLinks(t.link).length ? h('div',{class:'actions'}, linkBtns(t,true,'เข้าร่วม / รายละเอียด')) : null,
          h('div',{class:'att'},
            h('div',{class:'small',text: t.allMgmt ? `🏪 สาขาที่ต้องเข้าอบรม: ทุกสาขา (${t.req.length}) · ผู้เข้าอบรม = Management`
              : `🏪 สาขาที่ต้องเข้าอบรม ${t.req.length} สาขา · ระบุชื่อแล้ว ${t.req.length - t.missing.length} สาขา` + (t.att.length ? ` (${t.att.length} คน)` : '')}),
            t.allMgmt ? null : bar(t.req.length ? (t.req.length - t.missing.length)/t.req.length : 1),
            h('div',{class:'chips'}, t.byBr.map(x => h('button',{class:'chip '+(x.ps.length || (t.staff&&t.staff[x.b.code]) ? 'done' : t.allMgmt ? 'partial' : ''), style:'cursor:pointer', title:'กดเพื่อดูรายชื่อในหน้าสาขา', onclick:()=>goBranch(x.b.code),
              text: x.b.name + (x.ps.length ? ` · ${x.ps.length} คน` : (t.staff&&t.staff[x.b.code]) ? ` · ${t.staff[x.b.code].length} คน` : ' · Management')}))),
            h('div',{class:'small',style:'margin-top:4px',text:'กดชื่อสาขาเพื่อดูรายชื่อน้องที่เข้าอบรม · "Management" = ยังไม่ระบุชื่อ ให้ Management ของสาขาเข้าอบรม'})))))));
  }));
}

/* ---------- Area ---------- */
function renderAreaBar(){
  const areas = allAreas();
  if (areas.length < 2){ $('#areas').replaceChildren(); return; }
  const btn = (val, label) => h('button',{class:'area-btn'+(AREA===val?' active':''),onclick:()=>setArea(val),text:label});
  $('#areas').replaceChildren(btn('ALL','ทุก Area'), ...areas.map(a=>btn(a,'📍 '+a)));
}
function fillSelects(){
  const keepBr = $('#br-select').value, keepEx = $('#ex-select').value, keepType = $('#sum-type').value;
  const types = [...new Set(MODEL.tasks.map(t=>t.type).filter(Boolean))];
  $('#sum-type').replaceChildren(h('option',{value:'',text:'ทุกประเภทงาน'}), ...types.map(t=>h('option',{value:t,text:t})));
  if (types.includes(keepType)) $('#sum-type').value = keepType;
  const groups = [...new Set(MODEL.branches.map(areaOf))];
  const opts = (fmt) => groups.length > 1
    ? groups.map(a => h('optgroup',{label:a}, MODEL.branches.filter(b=>areaOf(b)===a).map(fmt)))
    : MODEL.branches.map(fmt);
  $('#br-select').replaceChildren(...opts(b=>h('option',{value:b.code,text:`${b.code} – ${b.name}`})));
  if (MODEL.bmap[keepBr]) $('#br-select').value = keepBr;
  $('#ex-select').replaceChildren(...MODEL.exams.map(e=>h('option',{value:e.exam_id,text:e.title})));
  if (keepEx) $('#ex-select').value = keepEx;
  $('#ex-branch').replaceChildren(h('option',{value:'',text: AREA==='ALL' ? 'ทุกสาขา' : 'ทุกสาขาใน '+AREA}), ...opts(b=>h('option',{value:b.code,text:b.name})));
}
function rerenderAll(){
  renderAreaBar(); fillSelects(); renderSummary(); renderExam(); renderTraining(); renderDaily(); renderHistory();
  if (!$('#tab-branch').hidden) renderBranch();
}
let lastLoad = null;
function stampLoad(){ lastLoad = new Date(); const el = $('#upd'); if (el) el.textContent = ' · อัปเดตล่าสุด ' + lastLoad.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'}) + ' น.'; }
async function refreshData(){
  if (!CONFIG.sheetId || document.hidden || pendingPosts) return;
  try { D = await loadSheet(); MODEL = build(D); rerenderAll(); stampLoad(); } catch (e) { /* เก็บข้อมูลเดิมไว้ */ }
}
function setArea(a){
  AREA = a; try { localStorage.setItem('tt-area', a); } catch(e){}
  MODEL = build(D); renderAreaBar(); fillSelects();
  renderSummary(); renderExam();
  renderTraining(); renderDaily(); renderHistory();
  if (!$('#tab-branch').hidden) renderBranch();
}

/* ---------- tabs & init ---------- */
function showTab(name){
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active', b.dataset.tab===name));
  ['summary','daily','rank','branch','exam','training','history'].forEach(n=>$('#tab-'+n).hidden = n!==name);
  if (name==='rank') renderRank();
  if (name==='branch'){ renderBranch(); try{ history.replaceState(null,'','#br-'+$('#br-select').value); }catch(e){} }
  else { try{ history.replaceState(null,'','#'+name); }catch(e){} }
  window.scrollTo(0,0);
}
async function init(){
  $('#today').textContent = 'ข้อมูล ณ ' + TODAY.toLocaleDateString('th-TH',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  if (CONFIG.sheetId){
    try { D = await loadSheet(); $('#src').textContent='เชื่อม Google Sheet แล้ว'; $('#src').classList.add('live'); }
    catch(e){ D = sampleData(); $('#banner').replaceChildren(h('div',{class:'banner',text:'โหลด Google Sheet ไม่สำเร็จ (ตรวจสอบการแชร์และชื่อแท็บ) – กำลังแสดงข้อมูลตัวอย่าง'})); }
  } else D = sampleData();
  try { const a = localStorage.getItem('tt-area'); if (a && (a==='ALL' || allAreas().includes(a))) AREA = a; } catch(e){}
  MODEL = build(D);
  renderAreaBar(); fillSelects();

  document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
  document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{ sumFilter=b.dataset.f; document.querySelectorAll('[data-f]').forEach(x=>x.classList.toggle('active',x===b)); renderSummary(); });
  document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{ sumCat=b.dataset.cat; document.querySelectorAll('[data-cat]').forEach(x=>x.classList.toggle('active',x===b)); renderSummary(); });
  $('#sum-type').onchange = renderSummary; $('#sum-q').oninput = renderSummary;
  document.querySelectorAll('[data-rk]').forEach(b=>b.onclick=()=>{ rkFilter=b.dataset.rk; document.querySelectorAll('[data-rk]').forEach(x=>x.classList.toggle('active',x===b)); renderRank(); });
  $('#rk-q').oninput = renderRank;
  document.querySelectorAll('[data-exv]').forEach(b=>b.onclick=()=>{ exView=b.dataset.exv; document.querySelectorAll('[data-exv]').forEach(x=>x.classList.toggle('active',x===b)); renderExam(); });
  $('#br-select').onchange = () => showTab('branch');
  $('#br-link').onclick = () => copy(location.href.split('#')[0] + '#br-' + $('#br-select').value);
  $('#ex-select').onchange = renderExam; $('#ex-branch').onchange = renderExam;
  document.querySelectorAll('[data-tr]').forEach(b=>b.onclick=()=>{ trFilter=b.dataset.tr; document.querySelectorAll('[data-tr]').forEach(x=>x.classList.toggle('active',x===b)); renderTraining(); });
  $('#tr-q').oninput = renderTraining;
  document.querySelectorAll('[data-dy]').forEach(b=>b.onclick=()=>{ dyFilter=b.dataset.dy; document.querySelectorAll('[data-dy]').forEach(x=>x.classList.toggle('active',x===b)); renderDaily(); });
  $('#dy-copy').onclick = () => copy(dailyMsg());

  renderSummary(); renderExam(); renderTraining(); renderDaily(); renderHistory();
  $('#hi-month').onchange = renderHistory; $('#hi-q').oninput = renderHistory;
  if (CONFIG.sheetId) { stampLoad(); setInterval(refreshData, 2 * 60 * 1000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden && lastLoad && Date.now() - lastLoad > 2 * 60 * 1000) refreshData(); }); }
  const hash = location.hash.slice(1);
  if (hash.startsWith('br-')){
    const c = hash.slice(3), b = D.branches.find(x=>x.code===c);
    if (b && !MODEL.bmap[c]){ AREA = areaOf(b); MODEL = build(D); renderAreaBar(); fillSelects(); renderSummary(); renderExam(); }
    if (MODEL.bmap[c]) $('#br-select').value = c; showTab('branch'); }
  else if (hash==='exam') showTab('exam');
  else if (hash==='training') showTab('training');
  else if (hash==='daily') showTab('daily');
  else if (hash==='history') showTab('history');
  else if (hash==='rank') showTab('rank');
}
init();
</script>
