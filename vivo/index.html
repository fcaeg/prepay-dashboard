<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Vivo Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f6f5f1; --panel: #ffffff; --fg: #1f1e1c; --muted: #6b6862; --line: #e3e0d8; --soft: #f1efe9;
  --accent: #3a4fd6; --accent-soft: #e7eafb; --ok: #23864f; --ok-soft: #e3f3ea; --warn: #a86a12; --warn-soft: #fbf0dc; --bad: #c53b32; --bad-soft: #fbe6e4;
  --sub: #f3f2ee; --tot: #e9e7e0; --shadow: 0 1px 2px rgba(0,0,0,.05);
  --font: "Noto Sans Thai", -apple-system, BlinkMacSystemFont, "Segoe UI", "Leelawadee UI", Tahoma, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1b1a18; --panel: #252421; --fg: #eeece6; --muted: #a5a29a; --line: #393733; --soft: #2d2b28;
  --accent: #8b9bff; --accent-soft: #2c3150; --ok: #4cc185; --ok-soft: #1f3a2b; --warn: #e0a63e; --warn-soft: #3d3020; --bad: #ef6b60; --bad-soft: #452523;
  --sub: #2c2a27; --tot: #34322e; --shadow: none;
} }
:root[data-theme="dark"] {
  --bg: #1b1a18; --panel: #252421; --fg: #eeece6; --muted: #a5a29a; --line: #393733; --soft: #2d2b28;
  --accent: #8b9bff; --accent-soft: #2c3150; --ok: #4cc185; --ok-soft: #1f3a2b; --warn: #e0a63e; --warn-soft: #3d3020; --bad: #ef6b60; --bad-soft: #452523;
  --sub: #2c2a27; --tot: #34322e; --shadow: none;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 var(--font); }
.wrap { max-width: 96rem; margin: 0 auto; padding: 16px max(16px, env(safe-area-inset-left)) 40px; }
header.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 8px 16px; margin-bottom: 12px; }
h1 { font-size: 24px; font-weight: 700; margin: 0; letter-spacing: -.01em; }
h1 small { font-size: 14px; font-weight: 500; color: var(--muted); margin-left: 6px; }
.asof { color: var(--muted); font-size: 12.5px; display: flex; flex-wrap: wrap; gap: 2px 14px; }
.asof a { color: var(--accent); }
.filters { position: sticky; top: 0; z-index: 20; background: var(--bg); padding: 8px 0 10px; border-bottom: 1px solid var(--line); margin-bottom: 14px;
  display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: end; }
.f { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.f label { font-size: 11.5px; color: var(--muted); }
select, input[type=search] { font: inherit; font-size: 13.5px; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px; max-width: 15rem; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; background: var(--panel); }
.seg button { font: inherit; font-size: 13px; border: 0; background: none; color: var(--fg); padding: 6px 11px; cursor: pointer; white-space: nowrap; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.btn { font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 7px; padding: 6px 11px; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.spacer { flex: 1; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-bottom: 14px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; box-shadow: var(--shadow); }
.kpi .l { font-size: 12px; color: var(--muted); }
.kpi .v { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.25; margin-top: 2px; }
.kpi .s { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { height: 5px; background: var(--soft); border-radius: 3px; margin-top: 6px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
nav.tabs { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 12px; scrollbar-width: none; }
nav.tabs button { font: inherit; font-size: 13.5px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); padding: 7px 13px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
nav.tabs button[aria-selected="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
section.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; box-shadow: var(--shadow); margin-bottom: 14px; }
section.card[hidden] { display: none; }
.card-h { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 8px; }
.card-h h2 { font-size: 16px; margin: 0; font-weight: 600; }
.note { font-size: 12px; color: var(--muted); margin: 0 0 8px; }
.note b { color: var(--fg); font-weight: 600; }
.tw { overflow: auto; max-height: 72vh; border: 1px solid var(--line); border-radius: 8px; }
table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { padding: 5px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; text-align: right; }
th { position: sticky; top: 0; background: var(--soft); font-weight: 600; font-size: 12px; color: var(--muted); z-index: 2; }
thead tr:nth-child(2) th { top: 27px; }
th.g { text-align: center; color: var(--fg); border-left: 1px solid var(--line); }
th.gl, td.gl { border-left: 1px solid var(--line); }
td:first-child, th:first-child { text-align: left; position: sticky; left: 0; background: var(--panel); z-index: 1; max-width: 17rem; overflow: hidden; text-overflow: ellipsis; }
th:first-child { background: var(--soft); z-index: 3; }
td.t { text-align: left; }
th[data-sort] { cursor: pointer; }
th[data-sort]:hover { color: var(--accent); }
tr.sub td { background: var(--sub); font-weight: 600; }
tr.tot td { background: var(--tot); font-weight: 700; }
tr.ind td:first-child { padding-left: 20px; }
td.na { color: var(--muted); }
.p { display: inline-block; min-width: 3.4em; padding: 0 5px; border-radius: 5px; font-weight: 600; }
.p.ok { color: var(--ok); background: var(--ok-soft); } .p.warn { color: var(--warn); background: var(--warn-soft); } .p.bad { color: var(--bad); background: var(--bad-soft); }
.cw { font-weight: 600; } .cw.bad { color: var(--bad); } .cw.warn { color: var(--warn); } .cw.ok { color: var(--ok); }
.pc { display: inline-block; font-size: 11px; font-weight: 700; padding: 0 6px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); }
.cur { color: var(--accent); }
.two { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
@media (min-width: 1100px) { .two { grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); } }
.cmp { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; margin-bottom: 12px; }
.cmp .kpi .v { font-size: 18px; }
.locs { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12.5px; }
.empty { padding: 24px; text-align: center; color: var(--muted); }
h3 { font-size: 14px; margin: 4px 0 8px; font-weight: 600; }
@media (max-width: 640px) { h1 { font-size: 20px; } .kpi .v { font-size: 18px; } select { max-width: 11rem; } .filters { position: static; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Vivo Dashboard <small>True Shop · WW</small></h1>
      <div class="asof" id="asof"></div>
    </div>
    <div class="asof"><a href="../">← Prepay Dashboard</a></div>
  </header>

  <div class="filters" id="filters">
    <div class="f"><label for="f-month">เดือน</label><select id="f-month"></select></div>
    <div class="f"><label>หน่วย</label><div class="seg" id="f-metric"><button data-v="q" aria-pressed="true">QTY</button><button data-v="n" aria-pressed="false">Net Amount</button></div></div>
    <div class="f"><label for="f-zone">Region</label><select id="f-zone"></select></div>
    <div class="f"><label for="f-area">Area</label><select id="f-area"></select></div>
    <div class="f"><label for="f-type">ประเภทสาขา</label><select id="f-type"></select></div>
    <div class="f"><label for="f-pc">PC Vivo</label><select id="f-pc"><option value="ALL">ทั้งหมด</option><option value="Y">มี PC</option><option value="N">ไม่มี PC</option></select></div>
    <div class="f"><label for="f-model">Model</label><select id="f-model"></select></div>
    <div class="spacer"></div>
    <button class="btn primary" id="x-all">⤓ Export Excel ทั้งหมด</button>
  </div>

  <div class="kpis" id="kpis"></div>

  <nav class="tabs" role="tablist" id="tabs">
    <button role="tab" data-t="model" aria-selected="true">1 · ราย Model</button>
    <button role="tab" data-t="area" aria-selected="false">2 · ราย Area</button>
    <button role="tab" data-t="shop" aria-selected="false">3 · รายสาขา</button>
    <button role="tab" data-t="stock" aria-selected="false">4 · Stock &amp; Cover Week</button>
    <button role="tab" data-t="ms" aria-selected="false">5 · Model × สาขา (PC)</button>
  </nav>

  <section class="card" id="s-model">
    <div class="card-h"><h2>ยอดขายราย Model เทียบ Target รายสัปดาห์</h2><span class="spacer"></span><button class="btn" data-x="model">⤓ Excel</button></div>
    <p class="note" id="n-model"></p>
    <div class="tw" id="t-model"></div>
  </section>

  <section class="card" id="s-area" hidden>
    <div class="card-h"><h2>ยอดขายราย Area (15 เขต) จัดกลุ่มตาม Region</h2><span class="spacer"></span><button class="btn" data-x="area">⤓ Excel</button></div>
    <p class="note" id="n-area"></p>
    <div class="tw" id="t-area"></div>
  </section>

  <section class="card" id="s-shop" hidden>
    <div class="card-h"><h2>ยอดขายรายสาขา</h2>
      <div class="seg" id="f-tmode"><button data-v="full" aria-pressed="true">Target ทั้งเดือน</button><button data-v="day" aria-pressed="false">Target ตามวัน (8-7-7-8)</button></div>
      <input type="search" id="q-shop" placeholder="ค้นหาสาขา / รหัส" aria-label="ค้นหาสาขา">
      <span class="spacer"></span><button class="btn" data-x="shop">⤓ Excel</button></div>
    <p class="note" id="n-shop"></p>
    <div class="tw" id="t-shop"></div>
  </section>

  <section class="card" id="s-stock" hidden>
    <div class="card-h"><h2>Stock คงเหลือ และ Cover Week</h2><span class="spacer"></span><button class="btn" data-x="stock">⤓ Excel</button></div>
    <p class="note" id="n-stock"></p>
    <div class="locs" id="locs"></div>
    <div class="two" style="margin-top:8px">
      <div><h3>ราย Model</h3><div class="tw" id="t-stock-m"></div></div>
      <div><h3>รายสาขา <input type="search" id="q-stock" placeholder="ค้นหาสาขา" aria-label="ค้นหาสาขา" style="margin-left:8px;font-weight:400"></h3><div class="tw" id="t-stock-s"></div></div>
    </div>
  </section>

  <section class="card" id="s-ms" hidden>
    <div class="card-h"><h2>ยอดขายราย Model ของแต่ละสาขา</h2>
      <div class="f"><select id="f-msmodel" aria-label="เลือก Model"></select></div>
      <input type="search" id="q-ms" placeholder="ค้นหาสาขา" aria-label="ค้นหาสาขา">
      <span class="spacer"></span><button class="btn" data-x="ms">⤓ Excel</button></div>
    <p class="note" id="n-ms"></p>
    <div class="cmp" id="ms-cmp"></div>
    <div class="tw" id="t-ms"></div>
  </section>
</div>

<script>
'use strict';
const D = JSON.parse(document.getElementById('vivo-data').textContent);
const TH = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const THF = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const thDate = (v) => { if (!v) return '–'; const [y, m, d] = v.slice(0, 10).split('-').map(Number); return `${d} ${TH[m - 1]} ${y + 543}` + (v.length > 10 ? ` ${v.slice(11, 16)} น.` : ''); };
const zoneOf = (a) => { a = String(a || ''); if (/^BMA\b/.test(a)) return 'BMA'; if (/^UPC\b/.test(a)) return /North/i.test(a) ? 'UPC I' : 'UPC II'; return 'อื่น ๆ'; };
const ZONES = ['BMA', 'UPC I', 'UPC II'];
const SH = Object.fromEntries(D.shops.map((s) => [s.c, s]));
const MD = Object.fromEntries(D.models.map((m) => [m.k, m]));
const MORDER = Object.fromEntries(D.models.map((m, i) => [m.k, i]));
const LATEST = (D.meta.sales_asof || '').slice(0, 10);
const months = [...new Set([...D.sales.map((r) => r[0].slice(0, 7)), ...Object.keys(D.targets)])].sort().reverse();
const AREAS = [...new Set(D.shops.map((s) => s.area).filter(Boolean))].sort((a, b) => ZONES.indexOf(zoneOf(a)) - ZONES.indexOf(zoneOf(b)) || a.localeCompare(b));
const TYPES = ['Matching', 'Non Matching', 'Dtac Hall', 'Dtac Coco'];

const S = { month: months.find((m) => m === LATEST.slice(0, 7)) || months[0], metric: 'q', zone: 'ALL', area: 'ALL', type: 'ALL', pc: 'ALL', model: 'ALL', tab: 'model', tmode: 'full', msmodel: 'ALL', locs: new Set(D.locs.map((_, i) => i)),
  sort: { shop: ['ach', -1], stock: ['stock', -1], ms: ['act', -1] }, q: { shop: '', stock: '', ms: '' } };
try { const p = JSON.parse(localStorage.getItem('vivo-dash') || '{}'); if (p.metric) S.metric = p.metric; if (p.tab) S.tab = p.tab; if (p.tmode) S.tmode = p.tmode; } catch (e) {}
const persist = () => { try { localStorage.setItem('vivo-dash', JSON.stringify({ metric: S.metric, tab: S.tab, tmode: S.tmode })); } catch (e) {} };

// ---------- month geometry: weeks 8-7-7-8 / 8-7-7-9
function monthInfo(ym) {
  const [y, m] = ym.split('-').map(Number); const days = new Date(y, m, 0).getDate();
  const w = days >= 29 ? [[1, 8], [9, 15], [16, 22], [23, days]] : [[1, 7], [8, 14], [15, 21], [22, days]];
  const pp = D.portions[ym]; const announced = Array.isArray(pp) && pp.length === 4;
  const portion = announced ? pp.map((x) => x / 100) : w.map(([a, b]) => (b - a + 1) / days);
  let asofDay = days;
  if (LATEST.slice(0, 7) === ym) asofDay = +LATEST.slice(8, 10); else if (ym > LATEST.slice(0, 7)) asofDay = 0;
  const todate = w.reduce((s, [a, b], i) => s + portion[i] * Math.min(1, Math.max(0, (asofDay - a + 1) / (b - a + 1))), 0);
  const curWeek = w.findIndex(([a, b]) => asofDay >= a && asofDay < b);
  return { ym, y, m, days, weeks: w, portion, announced, asofDay, todate, curWeek };
}
const wkOf = (mi, d) => mi.weeks.findIndex(([a, b]) => d >= a && d <= b);

// ---------- filters
const okShop = (c) => { const s = SH[c]; if (!s) return false;
  if (S.zone !== 'ALL' && zoneOf(s.area) !== S.zone) return false; if (S.area !== 'ALL' && s.area !== S.area) return false;
  if (S.type !== 'ALL' && s.type !== S.type) return false; if (S.pc === 'Y' && !(s.pc > 0)) return false; if (S.pc === 'N' && s.pc > 0) return false; return true; };
const modelOk = (sel, k) => sel === 'ALL' || (sel.startsWith('F:') ? (MD[k] && MD[k].family === sel.slice(2)) : sel.startsWith('S:') ? (MD[k] && MD[k].series === sel.slice(2)) : k === sel.slice(2));
const okModel = (k) => modelOk(S.model, k);

// ---------- aggregation
const z = () => ({ u: 0, n: 0, wu: [0, 0, 0, 0], wn: [0, 0, 0, 0], tu: 0, tn: 0 });
function aggregate(mi, keyFn, modelSel) {
  const out = new Map(); const get = (k) => { let x = out.get(k); if (!x) out.set(k, x = z()); return x; };
  const msel = modelSel || S.model;
  for (const [d, c, k, u, n] of D.sales) {
    if (d.slice(0, 7) !== mi.ym || !okShop(c) || !modelOk(msel, k)) continue;
    const w = wkOf(mi, +d.slice(8, 10));
    for (const key of [].concat(keyFn(c, k))) { const x = get(key); x.u += u; x.n += n; if (w >= 0) { x.wu[w] += u; x.wn[w] += n; } }
  }
  for (const [c, k, tu, tn] of (D.targets[mi.ym] || [])) {
    if (!okShop(c) || !modelOk(msel, k)) continue;
    for (const key of [].concat(keyFn(c, k))) { const x = get(key); x.tu += tu; x.tn += tn; }
  }
  return out;
}
const V = (x) => S.metric === 'q' ? x.u : x.n;
const T = (x) => S.metric === 'q' ? x.tu : x.tn;
const W = (x, i) => S.metric === 'q' ? x.wu[i] : x.wn[i];

// 28-day window ending at the latest sales date
const L28 = (() => { if (!LATEST) return { from: '', to: '' }; const t = new Date(LATEST + 'T00:00:00'); const f = new Date(t); f.setDate(f.getDate() - 27);
  const iso = (x) => `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}-${String(x.getDate()).padStart(2, '0')}`; return { from: iso(f), to: LATEST }; })();
const HAS28 = D.meta.first_sales && D.meta.first_sales <= L28.from;
function sales28(keyFn, modelSel) {
  const out = new Map(); const msel = modelSel || S.model;
  for (const [d, c, k, u] of D.sales) { if (d < L28.from || d > L28.to || !okShop(c) || !modelOk(msel, k)) continue;
    for (const key of [].concat(keyFn(c, k))) out.set(key, (out.get(key) || 0) + u); }
  return out;
}
function stockBy(keyFn, modelSel) {
  const out = new Map(); const msel = modelSel || S.model;
  for (const [c, k, l, q] of D.stock) { if (!S.locs.has(l) || !okShop(c) || !modelOk(msel, k)) continue;
    for (const key of [].concat(keyFn(c, k))) out.set(key, (out.get(key) || 0) + q); }
  return out;
}

// ---------- formatting
const nf0 = new Intl.NumberFormat('en-US', { maximumFractionDigits: 0 });
const nf1 = new Intl.NumberFormat('en-US', { maximumFractionDigits: 1, minimumFractionDigits: 1 });
const num = (v) => v == null || !isFinite(v) ? '–' : nf0.format(Math.round(v));
const tgtF = (v) => v == null || !isFinite(v) || v === 0 ? '–' : (S.metric === 'q' && Math.abs(v) < 100 && Math.abs(v - Math.round(v)) > 0.05 ? nf1.format(v) : nf0.format(Math.round(v)));
const pctCls = (p) => p >= 1 ? 'ok' : p >= 0.8 ? 'warn' : 'bad';
const pct = (p) => p == null || !isFinite(p) ? '<span class="na">–</span>' : `<span class="p ${pctCls(p)}">${Math.round(p * 100)}%</span>`;
const ratio = (a, b) => b > 0 ? a / b : null;
const HASSTOCK = D.stock.length > 0;
const cover = (stock, s28) => !HASSTOCK ? null : stock === 0 && s28 > 0 ? -1 : s28 > 0 ? stock / (s28 / 4) : (stock > 0 ? Infinity : null);
const coverF = (c, stock) => c == null ? '<span class="na">–</span>' : c === -1 ? '<span class="cw bad">ของหมด</span>' : c === Infinity ? '<span class="cw warn" title="มี Stock แต่ไม่มีขายใน 28 วัน">ไม่มีขาย</span>'
  : `<span class="cw ${c < 1 ? 'bad' : c < 2 ? 'warn' : c > 8 ? 'warn' : 'ok'}">${nf1.format(c)}</span>`;
const unit = () => S.metric === 'q' ? 'เครื่อง' : 'บาท';

// ---------- generic table: cols [{h, g?, v(row) -> raw, f(raw,row) -> html, cls, sort?, x?(raw)->excel}]
let EXPORT = {};
function renderTable(el, cols, rows, opt = {}) {
  const groups = []; cols.forEach((c, i) => { const g = c.g || ''; if (groups.length && groups[groups.length - 1].g === g) groups[groups.length - 1].n++; else groups.push({ g, n: 1, i }); });
  const hasG = groups.some((g) => g.g);
  let h = '<table><thead>';
  if (hasG) h += '<tr>' + groups.map((g) => g.g ? `<th colspan="${g.n}" class="g">${g.g}</th>` : `<th colspan="${g.n}"></th>`).join('') + '</tr>';
  const sortKey = opt.sort ? S.sort[opt.sort] : null;

  const areaOpts = () => [['ALL', 'ทุก Area'], ...AREAS.filter((a) => S.zone === 'ALL' || zoneOf(a) === S.zone).map((a) => [a, a])];
  fillSelect($('#f-area'), areaOpts(), 'ALL');
  fillSelect($('#f-type'), [['ALL', 'ทุกประเภท'], ...TYPES.map((t) => [t, t])], 'ALL');
  fillSelect($('#f-model'), modelOptions(), 'ALL');
  fillSelect($('#f-msmodel'), [['ALL', 'ตาม Model ที่กรองด้านบน'], ...modelOptions().slice(1)], 'ALL');
  $('#f-month').onchange = (e) => { S.month = e.target.value; render(); };
  $('#f-zone').onchange = (e) => { S.zone = e.target.value; S.area = 'ALL'; fillSelect($('#f-area'), areaOpts(), 'ALL'); render(); };
  for (const [id, key] of [['#f-area', 'area'], ['#f-type', 'type'], ['#f-pc', 'pc'], ['#f-model', 'model'], ['#f-msmodel', 'msmodel']]) $(id).onchange = (e) => { S[key] = e.target.value; render(); };
  const seg = (id, key) => { const el = $(id); const set = () => el.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === S[key])));
    set(); el.onclick = (e) => { const b = e.target.closest('button'); if (!b) return; S[key] = b.dataset.v; set(); persist(); render(); }; };
  seg('#f-metric', 'metric'); seg('#f-tmode', 'tmode');
  const tabs = () => { document.querySelectorAll('#tabs button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.t === S.tab)));
    for (const t of ['model', 'area', 'shop', 'stock', 'ms']) $('#s-' + t).hidden = t !== S.tab; };
  tabs(); $('#tabs').onclick = (e) => { const b = e.target.closest('button'); if (!b) return; S.tab = b.dataset.t; tabs(); persist(); };
  for (const [id, key] of [['#q-shop', 'shop'], ['#q-stock', 'stock'], ['#q-ms', 'ms']]) $(id).oninput = (e) => { S.q[key] = e.target.value.trim(); render(); };
  $('#locs').innerHTML = D.locs.length > 1 ? 'Location ที่นับเป็น Stock: ' + D.locs.map((l, i) => `<label><input type="checkbox" data-l="${i}" checked> ${esc(l)}</label>`).join('') : '';
  $('#locs').onchange = (e) => { const i = +e.target.dataset.l; if (e.target.checked) S.locs.add(i); else S.locs.delete(i); render(); };
  document.querySelectorAll('[data-x]').forEach((b) => b.onclick = () => { const k = b.dataset.x; downloadXlsx([].concat(EXPORT[k]), `Vivo_${k}_${S.month}.xlsx`); });
  $('#x-all').onclick = () => downloadXlsx([...['model', 'area', 'shop', 'stock', 'ms'].flatMap((k) => [].concat(EXPORT[k])), rawSheet()], `Vivo_Dashboard_${S.month}.xlsx`);
}
function rawSheet() {
  const rows = D.sales.filter(([d, c, k]) => d.slice(0, 7) === S.month && okShop(c) && okModel(k))
    .map(([d, c, k, u, n]) => [d, c, SH[c].n, SH[c].area, zoneOf(SH[c].area), SH[c].type, SH[c].pc || 0, (MD[k] || { name: k }).name, u, n]);
  return { name: 'Data ยอดขายรายวัน', rows: [['ยอดขายรายวัน ' + S.month + ' (ตามตัวกรอง)'], [], ['วันที่', 'รหัสสาขา', 'สาขา', 'Area', 'Region', 'ประเภท', 'PC Vivo', 'Model', 'QTY', 'Net Amount'], ...rows], header: 2, pctCols: [] };
}

function render() {
  const mi = monthInfo(S.month); EXPORT = {};
  const tot = sModel(mi); sArea(mi); sShop(mi); const ts = sStock(); sMS(mi); kpis(mi, tot, ts);
}

// ---------- minimal XLSX writer (stored zip, no external library)
const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
const crc32 = (b) => { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CRC[(c ^ b[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
function zip(files) {
  const enc = new TextEncoder(); const parts = []; const cd = []; let off = 0;
  for (const [name, text] of files) {
    const nb = enc.encode(name), db = enc.encode(text), c = crc32(db);
    const h = new DataView(new ArrayBuffer(30)); h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint32(14, c, true); h.setUint32(18, db.length, true); h.setUint32(22, db.length, true); h.setUint16(26, nb.length, true);
    parts.push(new Uint8Array(h.buffer), nb, db);
    const e = new DataView(new ArrayBuffer(46)); e.setUint32(0, 0x02014b50, true); e.setUint16(4, 20, true); e.setUint16(6, 20, true); e.setUint16(8, 0x0800, true); e.setUint32(16, c, true); e.setUint32(20, db.length, true); e.setUint32(24, db.length, true); e.setUint16(28, nb.length, true); e.setUint32(42, off, true);
    cd.push(new Uint8Array(e.buffer), nb); off += 30 + nb.length + db.length;
  }
  const cdl = cd.reduce((s, x) => s + x.length, 0); const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true); end.setUint32(12, cdl, true); end.setUint32(16, off, true);
  return new Blob([...parts, ...cd, new Uint8Array(end.buffer)], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
}
const xe = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '');
const colL = (i) => { let s = ''; i++; while (i) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; };
function downloadXlsx(sheets, fname) {
  sheets = sheets.filter(Boolean); const used = new Set();
  const names = sheets.map((s) => { let n = s.name.replace(/[\\/?*\[\]:]/g, ' ').slice(0, 31); while (used.has(n)) n = n.slice(0, 28) + '_' + used.size; used.add(n); return n; });
  const files = [['[Content_Types].xml', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'
      + sheets.map((_, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('') + '</Types>'],
    ['_rels/.rels', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'],
    ['xl/workbook.xml', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>'
      + names.map((n, i) => `<sheet name="${xe(n)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('') + '</sheets></workbook>'],
    ['xl/_rels/workbook.xml.rels', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
      + sheets.map((_, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('')
      + `<Relationship Id="rId${sheets.length + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`],
    ['xl/styles.xml', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><numFmts count="1"><numFmt numFmtId="164" formatCode="#,##0.0"/></numFmts><fonts count="2"><font><sz val="11"/><name val="Tahoma"/></font><font><b/><sz val="11"/><name val="Tahoma"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFE9E7E0"/></patternFill></fill></fills><borders count="1"><border/></borders><cellStyleXfs count="1"><xf/></cellStyleXfs><cellXfs count="6"><xf/><xf fontId="1" applyFont="1"/><xf fontId="1" fillId="2" applyFont="1" applyFill="1"/><xf numFmtId="3" applyNumberFormat="1"/><xf numFmtId="9" applyNumberFormat="1"/><xf numFmtId="164" applyNumberFormat="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>']];
  sheets.forEach((s, si) => {
    const widths = [];
    const rows = s.rows.map((r, ri) => `<row r="${ri + 1}">` + r.map((v, ci) => {
      const ref = colL(ci) + (ri + 1); const head = ri === s.header; const title = ri === 0;
      widths[ci] = Math.max(widths[ci] || 6, Math.min(48, String(v ?? '').length + 2));
      if (typeof v === 'number' && isFinite(v)) { const st = s.pctCols.includes(ci) ? 4 : (Math.abs(v - Math.round(v)) > 1e-9 && Math.abs(v) < 1000 ? 5 : 3); return `<c r="${ref}" s="${st}"><v>${s.pctCols.includes(ci) ? v : Math.round(v * 100) / 100}</v></c>`; }
      if (v == null || v === '') return '';
      return `<c r="${ref}" t="inlineStr" s="${head ? 2 : title ? 1 : 0}"><is><t xml:space="preserve">${xe(v)}</t></is></c>`; }).join('') + '</row>').join('');
    if (s.rows[0]) widths[0] = Math.max(Math.min(widths[0], 40), 12);
    files.push([`xl/worksheets/sheet${si + 1}.xml`, '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane xSplit="1" ySplit="' + (s.header + 1) + '" topLeftCell="B' + (s.header + 2) + '" activePane="bottomRight" state="frozen"/></sheetView></sheetViews><cols>'
      + widths.map((w, i) => `<col min="${i + 1}" max="${i + 1}" width="${i === 0 ? Math.max(w, 14) : Math.min(w, 22)}" customWidth="1"/>`).join('') + '</cols><sheetData>' + rows + '</sheetData></worksheet>']);
  });
  const a = document.createElement('a'); a.href = URL.createObjectURL(zip(files)); a.download = fname; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
